:root{
  --txt:#1f4647; --txt-2:#5d7778; --verde:#9eea6c; --verde-esc:#4fa21f; --verde-bg:#eefbe5;
  --grid:#d3dce8; --hatch:#dde6ef; --wash:#f6f9f5; --paper:#fff; --navy:#173a3b;
  --erro:#c0392b; --erro-bg:#fdecea; --alerta:#b7791f; --alerta-bg:#fff6e0;
  --content:1440px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;background:var(--grid);color:var(--txt);font-family:'Fustat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid rgba(79,162,31,.35);outline-offset:3px}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-weight:700}
svg.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-feature-settings:'tnum' 0}
td.num,td .num,dd.num{font-variant-numeric:tabular-nums}

/* ============ a grade da página inteira (como a landing de referência) ============ */
.page-grid{display:grid;grid-template-columns:minmax(40px,1fr) minmax(0,var(--content)) minmax(40px,1fr);gap:1px;background:var(--grid);position:relative;--raio:10px}
.cell{min-width:0;background:var(--paper);position:relative}
.rail.wash{background:var(--wash)}
.rail.paper{background:var(--paper)}
.rail.verde{background:var(--verde-bg)}
.rail.dark{background:var(--navy)}
.hatch,.rail.hatch{background-color:var(--paper);background-image:repeating-linear-gradient(45deg,transparent 0,transparent 13px,var(--hatch) 13px,var(--hatch) 14px)}
.stripe{min-height:56px;background-color:var(--paper);background-image:repeating-linear-gradient(45deg,transparent 0,transparent 14px,var(--hatch) 14px,var(--hatch) 15px)}
.sub-grid{display:grid;gap:1px;background:var(--grid);position:relative;--raio:28px;min-width:0}
.sub-grid.fino{--raio:14px}
.sub-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sub-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sub-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc{background:var(--paper);padding:40px 44px;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px}
.kc.s2{grid-column:span 2}
.kc.mini{padding:30px 34px;gap:18px;min-height:176px;justify-content:flex-start}
.kc.hatch{background-color:var(--paper)}
.kc.cheio{display:block}

/* ============ topo ============ */
.topo{position:sticky;top:0;z-index:30;background:var(--grid);padding-bottom:1px}
.topo .cabeca{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 38px;min-height:92px}
.logo{display:inline-flex;align-items:center;text-decoration:none;flex:none}
.logo svg{height:60px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
.nav a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;color:var(--txt-2);transition:background .2s var(--ease),color .2s var(--ease)}
.nav a:hover{background:var(--verde-bg);color:var(--txt)}
.nav a.ativo{background:var(--txt);color:#fff}
.nav a.ativo svg{color:var(--verde)}
.ref{display:flex;align-items:center;gap:8px;flex:none;color:var(--txt-2)}
.ref input{width:auto;padding:8px 12px;font-size:13px;border-radius:999px;min-height:40px}
.ref button{border:0;background:none;color:var(--txt-2);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}

/* ============ títulos e textos ============ */
.pg-titulo{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex-wrap:wrap;padding:64px 56px 58px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--verde-esc);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.eyebrow svg{width:1.3em;height:1.3em}
h1{margin:0 0 14px;color:var(--txt);font-size:clamp(2.1rem,3.6vw,3.3rem);line-height:1.02;letter-spacing:-.045em}
h1 .chip{vertical-align:middle;margin-left:12px;font-size:13px;letter-spacing:0}
.lead{max-width:640px;margin:0;color:var(--txt-2);font-size:1.02rem;line-height:1.7}
.acoes-titulo{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h2{margin:0 0 6px;font-size:1.35rem;letter-spacing:-.03em}
.rotulo{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--txt-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.grande{font-size:clamp(2rem,3vw,2.7rem);font-weight:700;line-height:1.05;letter-spacing:-.05em}
.sub{margin-top:8px;color:var(--txt-2);font-size:13.5px}
.selo{display:grid;width:52px;height:52px;place-items:center;border-radius:14px;background:var(--verde-bg);color:var(--verde-esc);flex:none}
.selo svg{width:24px;height:24px}
.tag{padding:6px 12px;border-radius:999px;background:#f3f6f9;color:#49647e;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.kc-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}

/* ============ botões ============ */
.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:10px;padding:0 22px;border:1px solid transparent;border-radius:999px;cursor:pointer;font-size:14px;font-weight:700;text-decoration:none;background:var(--wash);color:var(--txt);transition:transform .18s var(--ease),background .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);background:var(--verde-bg)}
.btn:active{transform:none}
.btn.primario{background:var(--verde);box-shadow:0 10px 24px -10px rgba(79,162,31,.6)}
.btn.primario:hover{background:#b0f284}
.btn.escuro{background:var(--txt);color:#fff}
.btn.escuro:hover{background:#2b5c5d}
.btn.contorno{background:var(--paper);border-color:var(--grid)}
.btn.mini{min-height:34px;padding:0 15px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.seta{display:inline-block;transition:transform .18s var(--ease)}
.btn:hover .seta,.link:hover .seta{transform:translateX(3px)}
.link{display:inline-flex;align-items:center;gap:8px;color:var(--verde-esc);font-weight:700;text-decoration:none}

/* ============ chips ============ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eef2f6;color:var(--txt);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.chip.ATIVA,.chip.PAGA,.chip.REGISTRADO{background:var(--verde-bg);color:#2f7a12}
.chip.LIQUIDADA{background:var(--txt);color:var(--verde)}
.chip.EM_ATRASO,.chip.VENCIDA,.chip.PARCIALMENTE_PAGA,.chip.CALCULADO{background:var(--alerta-bg);color:var(--alerta)}
.chip.INADIMPLENTE{background:var(--erro-bg);color:var(--erro)}
.chip.PENDENTE{background:#eef2f6;color:var(--txt-2)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--verde-bg);color:#2f7a12;font-size:12px;font-weight:700;letter-spacing:.05em}
.ponto{width:8px;height:8px;border-radius:50%;background:#b9c4cf}
.ponto.on{background:var(--verde-esc);box-shadow:0 0 0 0 rgba(79,162,31,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(79,162,31,0)}100%{box-shadow:0 0 0 0 rgba(79,162,31,0)}}

/* ============ barras ============ */
.barras{display:grid;gap:16px;margin-top:22px}
.barra{display:grid;grid-template-columns:132px 1fr 34px;align-items:center;gap:14px;font-size:14px}
.trilho{height:10px;background:#eef2f6;border-radius:99px;overflow:hidden}
.preench{height:100%;width:0;background:var(--verde);border-radius:99px;transition:width .9s var(--ease)}
.preench.EM_ATRASO{background:#f0b44c}.preench.INADIMPLENTE{background:#e5766b}.preench.LIQUIDADA{background:var(--txt)}

/* ============ tabelas ============ */
.corpo{padding:44px 56px}
.tabela-wrap{overflow-x:auto;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-2);font-weight:700;padding:0 14px 12px 0;white-space:nowrap}
td{padding:14px 14px 14px 0;border-top:1px solid #e9eef4;vertical-align:middle}
td.dir,th.dir{text-align:right;padding-left:14px;padding-right:0}
tr.clicavel{cursor:pointer}
tr.clicavel td{transition:background .2s}
tr.clicavel:hover td{background:#fafdf8}
.mudo{color:var(--txt-2)}

/* ============ formulários ============ */
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px}
.campo{display:grid;gap:8px;align-content:start;min-width:0;font-weight:700;font-size:13.5px}
.campo.s2{grid-column:1/-1}
.campo small{font-weight:400;color:var(--txt-2)}
.campo .rot{display:flex;align-items:center;gap:8px}
.campo .rot svg{color:var(--verde-esc);width:1.15em;height:1.15em}
input,textarea{width:100%;border:1px solid var(--grid);background:var(--paper);border-radius:14px;padding:11px 14px;transition:border-color .2s,box-shadow .2s;font-weight:400;min-height:46px}
input:focus,textarea:focus{outline:none;border-color:var(--verde-esc);box-shadow:0 0 0 4px rgba(158,234,108,.3)}
input[type=date]{accent-color:var(--verde-esc)}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;min-height:380px;resize:vertical;line-height:1.5}
.acoes{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.form-acoes{margin-top:26px}
.aviso-cel:empty{display:none}
.aviso{border-radius:14px;padding:13px 18px;font-weight:600;margin-top:22px;animation:entra .25s var(--ease) both}
.aviso.erro{background:var(--erro-bg);color:var(--erro)}
.aviso.ok{background:var(--verde-bg);color:#2f7a12}
.busca{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.busca input{max-width:340px;border-radius:999px;padding-left:18px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{border:1px solid var(--grid);background:var(--paper);padding:8px 15px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--txt-2);transition:all .2s;font-size:13.5px}
.filtros button.ativo{background:var(--txt);border-color:var(--txt);color:#fff}

/* ============ seletor estilizado ============ */
.combo{position:relative}
.combo-b,.combo-i{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--grid);background:var(--paper);border-radius:14px;padding:11px 14px;cursor:pointer;text-align:left;font-weight:400;min-height:46px;transition:border-color .2s,box-shadow .2s}
.combo-i{cursor:text;padding:0}
.combo-i input{border:0;box-shadow:none!important;background:none;border-radius:14px}
.combo-i svg{margin-right:14px}
.combo-b:hover{border-color:#bfcbda}
.combo.aberto .combo-b,.combo.aberto .combo-i,.combo-i:focus-within,.combo-b:focus-visible{border-color:var(--verde-esc);box-shadow:0 0 0 4px rgba(158,234,108,.3);outline:none}
.combo-b[disabled]{opacity:.55;cursor:not-allowed}
.combo-b svg,.combo-i svg{color:var(--txt-2);transition:transform .2s var(--ease)}
.combo.aberto .combo-b svg,.combo.aberto .combo-i svg{transform:rotate(180deg)}
.combo-v.ph{color:var(--txt-2)}
.combo-l{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;background:var(--paper);border:1px solid var(--grid);border-radius:16px;padding:6px;max-height:268px;overflow:auto;box-shadow:0 22px 44px -20px rgba(31,70,71,.4);animation:entra .18s var(--ease) both}
.combo-l[hidden]{display:none}
.combo-o{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.combo-o small{font-weight:400;color:var(--txt-2)}
.combo-o.ativo,.combo-o:hover,.combo-o.sel{background:var(--verde-bg)}
.combo-nada{padding:12px;color:var(--txt-2);font-weight:400}

/* ============ abas ============ */
.abas{display:flex;gap:6px;padding:0 44px}
.abas button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:19px 14px;font-weight:700;color:var(--txt-2);cursor:pointer;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.abas button.ativo{color:var(--txt);border-color:var(--verde)}
.abas button.ativo svg{color:var(--verde-esc)}

.vazio{text-align:center;padding:44px 12px;color:var(--txt-2)}
.vazio strong{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.carregando{padding:60px 56px;color:var(--txt-2);animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.4}}

/* ============ linha do tempo ============ */
.linha-tempo{display:grid;margin-top:26px}
.evento{display:grid;grid-template-columns:110px 18px 1fr;gap:14px;padding-bottom:22px}
.evento .data{color:var(--txt-2);font-size:13.5px;padding-top:2px}
.evento .pino{position:relative}
.evento .pino::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--verde-esc);box-shadow:0 0 0 4px var(--verde-bg)}
.evento.CALCULADO .pino::before{background:#f0b44c;box-shadow:0 0 0 4px var(--alerta-bg)}
.evento .pino::after{content:"";position:absolute;left:9px;top:20px;bottom:-26px;width:1px;background:#e3e9f0}
.evento:last-child .pino::after{display:none}
.evento h3{font-size:15px;margin-bottom:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evento .det{color:var(--txt-2);font-size:13.5px}

/* ============ cartão escuro (como o pipeline da referência) ============ */
.escuro-card{padding:28px;border-radius:20px;background:var(--navy);color:#fff;box-shadow:0 24px 60px -24px rgba(23,58,59,.5)}
.escuro-card .topo-c{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;color:#a9c4c0;font-size:12px}
.escuro-card .topo-c strong{color:#fff;font-size:14px}
.passos{display:grid;gap:10px}
.passo{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:14px;min-height:60px;padding:10px 14px;border-radius:12px;background:#21494a}
.passo .n{display:grid;width:32px;height:32px;place-items:center;border-radius:9px;background:#2d5c5d;color:var(--verde);font-size:12px;font-weight:700}
.passo strong{display:block;font-size:13.5px}
.passo small{display:block;margin-top:1px;color:#9cbab5;font-size:12px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;margin:20px 0 0}
.kv dt{color:var(--txt-2)}.kv dd{margin:0;font-weight:700;text-align:right}

/* ============ modal ============ */
.fundo{position:fixed;inset:0;background:rgba(23,58,59,.42);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border-radius:22px;padding:30px;max-width:470px;width:100%;animation:entra .25s var(--ease) both}
.modal h2{margin-bottom:8px}
.modal p{margin:0 0 18px;color:var(--txt-2)}
.modal .acoes{justify-content:flex-end}
.modal .kv{margin:0 0 22px}

/* ============ rodapé ============ */
.rodape{background:var(--navy);color:#a9c4c0}
.rodape .in{max-width:var(--content);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;padding:38px 44px}
.rodape strong{color:#fff;font-size:14px}
.rodape p{margin:0;font-size:12.5px}

.cta{display:grid;place-items:center;padding:78px 40px;text-align:center}
.cta h2{font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.05em;margin-bottom:12px}
.cta p{color:var(--txt-2);max-width:520px;margin:0 auto 28px}
.cta .acoes{justify-content:center}

/* ============ animações ============ */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.reveal.visible{opacity:1;transform:none}
/* nas células da grade só o conteúdo aparece; o fundo branco fica, senão a linha da grade vaza */
.kc.reveal{opacity:1;transform:none}
.kc.reveal>*{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.kc.reveal.visible>*{opacity:1;transform:none}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:980px){
  .page-grid{grid-template-columns:24px minmax(0,1fr) 24px}
  .sub-grid{--raio:22px}
  .sub-grid.fino{--raio:12px}
  .sub-grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sub-grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topo .cabeca{padding:14px 22px;flex-wrap:wrap}
  .nav{order:3;width:100%;justify-content:flex-start}
  .pg-titulo{padding:46px 30px 40px}
  .corpo{padding:34px 30px}
  .kc{padding:32px 30px}
}
@media (max-width:680px){
  .page-grid{grid-template-columns:14px minmax(0,1fr) 14px}
  .sub-grid{--raio:16px}
  .sub-grid.fino{--raio:10px}
  .sub-grid.c2,.sub-grid.c3,.sub-grid.c4{grid-template-columns:minmax(0,1fr)}
  .kc.s2{grid-column:auto}
  .logo svg{height:48px}
  .campos{grid-template-columns:minmax(0,1fr)}
  .evento{grid-template-columns:1fr;gap:2px}.evento .pino{display:none}
  .pg-titulo{padding:36px 20px 32px}.corpo{padding:28px 20px}.kc{padding:26px 20px}
  .barra{grid-template-columns:100px 1fr 28px}
  .abas{padding:0 14px;overflow-x:auto}
  .rodape .in{padding:28px 20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

    : `<div class="combo" data-combo="${id}"><input type="hidden" id="${id}"><button type="button" class="combo-b" aria-haspopup="listbox"><span class="combo-v ph">${esc(placeholder)}</span>${ic('chevron')}</button><div class="combo-l" hidden></div></div>`;
}
function ligarCombo(raiz, id, { digitavel = false, placeholder = 'Selecione' } = {}) {
  const caixa = $(`[data-combo="${id}"]`, raiz), campo = $('#' + id, raiz), lista = $('.combo-l', caixa);
  const botao = $('.combo-b', caixa), texto = $('.combo-v', caixa);
  let opcoes = [], ativo = -1;
  const fechar = () => { lista.hidden = true; caixa.classList.remove('aberto'); ativo = -1; };
  const pintarBotao = () => {
    if (digitavel) return;
    const o = opcoes.find((x) => x.valor === campo.value);
    texto.textContent = o ? o.rotulo : placeholder;
    texto.classList.toggle('ph', !o);
  };
  const escolher = (valor) => {
    campo.value = valor;
    pintarBotao(); fechar();
    campo.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const desenhar = () => {
    const filtro = digitavel ? campo.value.trim().toLowerCase() : '';
    const vis = opcoes.filter((o) => !filtro || `${o.valor} ${o.rotulo} ${o.sub || ''}`.toLowerCase().includes(filtro));
    lista.innerHTML = vis.length ? vis.map((o, i) => `<div class="combo-o ${o.valor === campo.value ? 'sel' : ''} ${i === ativo ? 'ativo' : ''}" role="option" data-v="${esc(o.valor)}"><span>${esc(o.rotulo)}</span>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</div>`).join('') : '<div class="combo-nada">Nada encontrado</div>';
    $$('.combo-o', lista).forEach((el) => (el.onmousedown = (e) => { e.preventDefault(); escolher(el.dataset.v); }));
  };
  const abrir = () => {
    if (botao && botao.disabled) return;
    $$('.combo.aberto').forEach((c) => { if (c !== caixa) { $('.combo-l', c).hidden = true; c.classList.remove('aberto'); } });
    desenhar(); lista.hidden = false; caixa.classList.add('aberto');
  };
  const mover = (d) => {
    const itens = $$('.combo-o', lista); if (!itens.length) return;
    ativo = (ativo + d + itens.length) % itens.length;
    itens.forEach((el, i) => el.classList.toggle('ativo', i === ativo));
    itens[ativo].scrollIntoView({ block: 'nearest' });
  };
  const teclas = (e) => {
    if (e.key === 'Escape') { fechar(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (lista.hidden) abrir(); mover(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (lista.hidden) abrir(); mover(-1); }
    else if (e.key === 'Enter' && !lista.hidden && ativo >= 0) { e.preventDefault(); escolher($$('.combo-o', lista)[ativo].dataset.v); }
  };
  if (digitavel) {
    campo.addEventListener('focus', abrir);
    campo.addEventListener('click', abrir);
    campo.addEventListener('input', () => { ativo = -1; abrir(); });
    campo.addEventListener('keydown', teclas);
    campo.addEventListener('blur', () => setTimeout(fechar, 120));
    $('.combo-i svg', caixa).addEventListener('mousedown', (e) => { e.preventDefault(); if (lista.hidden) { campo.focus(); abrir(); } else fechar(); });
  } else {
    botao.addEventListener('click', () => (lista.hidden ? abrir() : fechar()));
    botao.addEventListener('keydown', teclas);
    botao.addEventListener('blur', () => setTimeout(fechar, 120));
  }
  return {
    definir(novas, valor) {
      opcoes = novas;
      if (!digitavel) campo.value = valor !== undefined && opcoes.some((o) => o.valor === valor) ? valor : (opcoes[0] ? opcoes[0].valor : '');
      pintarBotao();
    },
    desabilitar(sim, aviso = placeholder) {
      if (!botao) return;
      botao.disabled = sim;
      if (sim) { campo.value = ''; texto.textContent = aviso; texto.classList.add('ph'); }
    },
  };
}

async function pool(itens, limite, fn) {
  const saida = new Array(itens.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limite, itens.length) }, async () => {
    while (i < itens.length) { const k = i++; try { saida[k] = await fn(itens[k]); } catch (e) { saida[k] = null; } }
  }));
  return saida;
}

    + linha(subgrade(
      kc(formulario, 'cheio')
      + kc(`<div class="escuro-card"><div class="topo-c"><strong>Como funciona</strong><span>${esc(olho)}</span></div><div class="passos">${passos.map(([a, b], i) => `<div class="passo"><span class="n">0${i + 1}</span><span><strong>${esc(a)}</strong><small>${esc(b)}</small></span></div>`).join('')}</div></div>`, 'hatch'), 'c2'))
    + '<div id="saida" style="display:contents"></div>';
}
function resultado(tituloTxt, linhas, extra = '') {
  return linha(celula(`<div class="corpo reveal"><div class="eyebrow">${ic('liquidar')} Resultado</div><h2>${esc(tituloTxt)}</h2><dl class="kv">${linhas.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="num">${esc(v)}</dd>`).join('')}</dl>${extra ? `<div class="acoes" style="margin-top:26px">${extra}</div>` : ''}</div>`)) + faixa();
}
const mostrarSaida = (html) => { const s = $('#saida'); s.innerHTML = html; pronto(s); };

/* ---------- pagar ---------- */
telas.pagar = async (meu) => {
  const p = paramsDaRota();
  const lista = await opcoesDeOperacao();
  if (meu !== ciclo) return;
  montar(paginaForm({
    icone: 'pagar', olho: 'Pagamentos', titulo: 'Pagar uma parcela.',
    sub: 'Vale para as parcelas vencidas e para a próxima a vencer.',
    passos: [['Multa', 'Primeiro o que é devido pelo atraso'], ['Juros de mora', 'Depois a mora acumulada'], ['Juros da parcela', 'Em seguida os juros do período'], ['Amortização', 'O que sobrar abate o saldo devedor']],
    formulario: `<form id="f" autocomplete="off"><div class="campos">
      ${campoOp(p.get('op') || '')}
      <div class="campo s2"><span class="rot">${ic('parcelas')} Parcela</span>${htmlCombo('parcela', { placeholder: 'Escolha a operação' })}<small id="dicaParcela"></small></div>
      <label class="campo"><span class="rot">${ic('pago')} Valor (R$)</span><input id="valor" inputmode="decimal" placeholder="0,00" required></label>
      ${campoData('data', 'Data do pagamento')}
      <label class="campo s2"><span class="rot">${ic('tag')} Origem <small>(opcional)</small></span><input id="origem" maxlength="30" placeholder="CLIENTE, BOLETO, INSS…"></label>
      </div><div id="aviso"></div>
      <div class="acoes form-acoes"><button class="btn primario" type="submit">${ic('pagar')} Registrar pagamento</button><button class="btn contorno" type="button" id="quitar" disabled>Preencher valor para quitar</button></div></form>`,
  }), (app) => {
    const cOp = ligarCombo(app, 'op', { digitavel: true });
    const cParcela = ligarCombo(app, 'parcela', { placeholder: 'Escolha a operação' });
    cOp.definir(lista);
    cParcela.desabilitar(true, 'Escolha a operação');
    let parcelas = [];
    const dica = () => {
      const par = parcelas.find((x) => String(x.numero) === $('#parcela', app).value);
      $('#quitar', app).disabled = !par;
      $('#dicaParcela', app).textContent = par ? `Para quitar em ${dataBR(estado.dataRef || hojeISO())}: ${R$(par.totalParaQuitar)}` : '';
    };
    const carregarParcelas = async (limpar = true) => {
      const op = $('#op', app).value.trim();
      if (!op) return;
      try {
        parcelas = (await ler(comData(`/operacoes/${idOp(op)}/parcelas`))).filter((x) => x.status !== 'PAGA');
        cParcela.desabilitar(false);
        cParcela.definir(parcelas.map((x) => ({ valor: String(x.numero), rotulo: `Parcela ${x.numero} · vence ${dataBR(x.vencimento)}`, sub: ROTULO[x.status] })), p.get('parcela') || undefined);
        if (!parcelas.length) cParcela.desabilitar(true, 'Todas as parcelas estão pagas');
        if (limpar) $('#aviso', app).innerHTML = '';
      } catch (e) { parcelas = []; cParcela.desabilitar(true, '—'); $('#aviso', app).innerHTML = aviso('erro', e.message); }
      dica(); ativarBlocos();
    };
    $('#op', app).addEventListener('change', () => carregarParcelas());
    $('#parcela', app).addEventListener('change', dica);
    $('#quitar', app).onclick = () => { const par = parcelas.find((x) => String(x.numero) === $('#parcela', app).value); if (par) $('#valor', app).value = String(par.totalParaQuitar).replace('.', ','); };
    if ($('#op', app).value) carregarParcelas();
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      const op = $('#op', app).value.trim(), num = $('#parcela', app).value, valor = Math.round(paraNumero($('#valor', app).value) * 100) / 100;
      const data = $('#data', app).value, origem = $('#origem', app).value.trim();
      if (!op || !num) { $('#aviso', app).innerHTML = aviso('erro', 'Escolha a operação e a parcela.'); ativarBlocos(); return; }
      if (!(valor > 0)) { $('#aviso', app).innerHTML = aviso('erro', 'Informe um valor maior que zero.'); ativarBlocos(); return; }
      if (!(await confirmar({ titulo: 'Registrar pagamento?', texto: 'O pagamento fica gravado no histórico e não pode ser desfeito.', linhas: [['Operação', op], ['Parcela', num], ['Valor', R$(valor)], ['Data', dataBR(data)]], ok: 'Registrar' }))) return;
      const corpo = { valor, dataPagamento: data, identificadorPagamento: tokenUnico('web') };
      if (origem) corpo.origem = origem;
      try {
        const { corpo: r, status } = await api(`/operacoes/${idOp(op)}/parcelas/${num}/pagamentos`, { method: 'POST', body: corpo });
        $('#aviso', app).innerHTML = aviso('ok', status === 201 ? 'Pagamento registrado.' : 'Esse pagamento já estava registrado.');
        mostrarSaida(resultado('Como o dinheiro foi aplicado', [['Multa', R$(r.distribuicao.multa)], ['Juros de mora', R$(r.distribuicao.jurosMora)], ['Juros', R$(r.distribuicao.juros)], ['Amortização', R$(r.distribuicao.amortizacao)],
          ['Parcela ' + r.parcela.numero, (ROTULO[r.parcela.status] || r.parcela.status) + ' · falta ' + R$(r.parcela.valorEmAberto + r.parcela.encargosEmAberto)], ['Situação da operação', ROTULO[r.operacao.status] || r.operacao.status], ['Saldo devedor', R$(r.operacao.saldoDevedor)]],
          `<a class="btn escuro" href="#/operacoes/${esc(r.operacao.numeroOperacao)}">${ic('contrato')} Ver operação</a>`));
        carregarParcelas(false);
      } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
      ativarBlocos();
    };
  });
};

/* ---------- amortizar ---------- */
telas.amortizar = async (meu) => {
  const p = paramsDaRota();
  const lista = await opcoesDeOperacao();
  if (meu !== ciclo) return;
  montar(paginaForm({
    icone: 'amortizar', olho: 'Amortização', titulo: 'Antecipe parcelas da operação.',
    sub: 'Quitação pelo valor presente, com desconto dos juros que ainda não correram. Só vale sem parcela vencida.',
    passos: [['Escolha as parcelas', 'Últimas (mais desconto) ou próximas a vencer (menos desconto)'], ['Simule', 'Veja o valor presente e o desconto de cada parcela'], ['Confirme', 'O pagamento é gravado numa transação só'], ['Recalculamos', 'As parcelas que sobram refazem juros e amortização']],
    formulario: `<form id="f" autocomplete="off"><div class="campos">
      ${campoOp(p.get('op') || '')}
      <div class="campo s2"><span class="rot">${ic('desconto')} Quais parcelas</span>${htmlCombo('modo', { placeholder: 'Escolha o modo' })}<small id="dicaModo"></small></div>
      <label class="campo"><span class="rot">${ic('parcelas')} Quantas parcelas</span><input id="qtd" type="number" min="1" step="1" value="2" required></label>
      ${campoData('data', 'Data', 'Vale para a simulação e para o pagamento')}
      </div><div id="aviso"></div>
      <div class="acoes form-acoes"><button class="btn primario" type="submit">${ic('amortizar')} Simular</button></div></form>`,
  }), (app) => {
    ligarCombo(app, 'op', { digitavel: true }).definir(lista);
    const MODOS = { ULTIMAS: 'Últimas parcelas: reduz o prazo e dá mais desconto', PROXIMAS: 'Próximas a vencer: menos desconto, melhor para o negócio' };
    ligarCombo(app, 'modo', { placeholder: 'Escolha o modo' }).definir([
      { valor: 'ULTIMAS', rotulo: 'Últimas parcelas', sub: 'mais desconto' },
      { valor: 'PROXIMAS', rotulo: 'Próximas a vencer', sub: 'menos desconto' },
    ], 'ULTIMAS');
    const dicaModo = () => { $('#dicaModo', app).textContent = MODOS[$('#modo', app).value] || ''; };
    $('#modo', app).addEventListener('change', dicaModo);
    dicaModo();
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      const op = $('#op', app).value.trim(), qtd = Number($('#qtd', app).value), data = $('#data', app).value, modo = $('#modo', app).value || 'ULTIMAS';
      const rotuloModo = modo === 'PROXIMAS' ? 'próximas a vencer' : 'últimas';
      try {
        const s = await ler(`/operacoes/${idOp(op)}/amortizacoes/simulacao?quantidadeParcelas=${qtd}&modo=${modo}&dataReferencia=${data}`);
        $('#aviso', app).innerHTML = '';
        mostrarSaida(linha(celula(`<div class="corpo reveal"><div class="eyebrow">${ic('amortizar')} Simulação</div><h2>${s.parcelas.length} parcela(s) antecipada(s) · ${rotuloModo}</h2>
          <div class="tabela-wrap"><table><thead><tr><th>#</th><th>Vencimento</th><th class="dir">Valor da parcela</th><th class="dir">Valor presente</th><th class="dir">Desconto</th><th class="dir">Amortização</th><th class="dir">Juros</th></tr></thead><tbody>
          ${s.parcelas.map((x) => `<tr><td><strong>${x.numero}</strong></td><td>${dataBR(x.vencimento)}</td><td class="dir num">${R$(x.valorParcela)}</td><td class="dir num">${R$(x.valorPresente)}</td><td class="dir num">${R$(x.desconto)}</td><td class="dir num">${R$(x.amortizacao)}</td><td class="dir num">${R$(x.juros)}</td></tr>`).join('')}</tbody></table></div>
          <dl class="kv"><dt>Total a pagar</dt><dd class="num">${R$(s.totais.valorAPagar)}</dd><dt>Desconto total</dt><dd class="num">${R$(s.totais.desconto)}</dd><dt>Saldo devedor</dt><dd class="num">${R$(s.saldoDevedorAntes)} → ${R$(s.saldoDevedorApos)}</dd><dt>Parcelas que continuam</dt><dd>${s.quantidadeParcelasRestantes}</dd></dl>
          <div class="acoes" style="margin-top:26px"><button class="btn primario" type="button" id="confirmar">${ic('liquidar')} Confirmar amortização</button></div></div>`)) + faixa());
        $('#confirmar', app).onclick = async () => {
          if (!(await confirmar({ titulo: 'Registrar amortização?', texto: 'As parcelas ficam quitadas e a tabela das que sobram é recalculada.', linhas: [['Operação', op], ['Parcelas', `${qtd} (${rotuloModo})`], ['Total a pagar', R$(s.totais.valorAPagar)], ['Data', dataBR(data)]], ok: 'Registrar' }))) return;
          try {
            const { corpo: r } = await api(`/operacoes/${idOp(op)}/amortizacoes`, { method: 'POST', body: { quantidadeParcelas: qtd, modo, dataPagamento: data, identificadorPagamento: tokenUnico('web') } });
            $('#aviso', app).innerHTML = aviso('ok', 'Amortização registrada.');
            mostrarSaida(resultado('Amortização registrada', [['Parcelas quitadas', r.lancamentos.map((x) => x.numero).join(', ')], ['Total pago', R$(r.totais.valorAPagar)], ['Desconto', R$(r.totais.desconto)], ['Saldo devedor', R$(r.saldoDevedorAntes) + ' → ' + R$(r.saldoDevedorApos)]],
              `<a class="btn escuro" href="#/operacoes/${esc(r.numeroOperacao)}">${ic('contrato')} Ver operação</a>`));
          } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
          ativarBlocos();
        };
      } catch (er) { mostrarSaida(''); $('#aviso', app).innerHTML = aviso('erro', er.message); }
      ativarBlocos();
    };
  });
};

/* ---------- liquidar ---------- */
telas.liquidar = async (meu) => {
  const p = paramsDaRota();
  const lista = await opcoesDeOperacao();
  if (meu !== ciclo) return;
  montar(paginaForm({
    icone: 'liquidar', olho: 'Liquidação', titulo: 'Quite a operação inteira.',
    sub: 'Parcelas vencidas com encargos mais as a vencer pelo valor presente, sem tarifa.',
    passos: [['Consulte', 'O valor para quitar depende da data'], ['Confira', 'Vencidas com multa e mora, a vencer com desconto'], ['Quite', 'O valor pago precisa ser exatamente o calculado'], ['Operação liquidada', 'Todas as parcelas ficam pagas e o saldo zera']],
    formulario: `<form id="f" autocomplete="off"><div class="campos">
      ${campoOp(p.get('op') || '')}
      ${campoData('data', 'Data', 'Vale para a consulta e para o pagamento', 's2')}
      </div><div id="aviso"></div>
      <div class="acoes form-acoes"><button class="btn primario" type="submit">${ic('liquidar')} Ver valor para quitar</button></div></form>`,
  }), (app) => {
    ligarCombo(app, 'op', { digitavel: true }).definir(lista);
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      const op = $('#op', app).value.trim(), data = $('#data', app).value;
      try {
        const v = await ler(`/operacoes/${idOp(op)}/liquidacao?dataReferencia=${data}`);
        $('#aviso', app).innerHTML = '';
        mostrarSaida(linha(subgrade(
          kc(`<div><div class="rotulo">${ic('liquidar')} Valor para quitar em ${dataBR(v.dataReferencia)}</div><div class="grande num">${R$(v.valorParaQuitar)}</div><div class="sub">saldo devedor ${R$(v.saldoDevedor)}</div></div>`, 's2 hatch')
          + kc(`<div><div class="rotulo">${ic('desconto')} Desconto</div><div class="grande num">${R$(v.aVencer.desconto)}</div><div class="sub">sobre ${R$(v.aVencer.valorNominal)} a vencer</div></div>`)
          + kc(`<div><div class="rotulo">${ic('alerta')} Vencidas (${v.vencidas.parcelas.length})</div><div class="grande num">${R$(v.vencidas.total)}</div><div class="sub">com multa e mora</div></div>`)
          + kc(`<div><div class="rotulo">${ic('calendario2')} A vencer (${v.aVencer.parcelas.length}) pelo valor presente</div><div class="grande num">${R$(v.aVencer.valorPresente)}</div><div class="sub">principal ${R$(v.aVencer.amortizacao)} + juros ${R$(v.aVencer.juros)}</div></div>`, 's2')
          + kc(`<div class="acoes"><button class="btn primario" type="button" id="quitar">${ic('liquidar')} Quitar operação</button></div>`, 's2 hatch'), 'c4 fino')) + faixa());
        $('#quitar', app).onclick = async () => {
          if (!(await confirmar({ titulo: 'Quitar a operação?', texto: 'Todas as parcelas ficam pagas e a operação é liquidada. Não pode ser desfeito.', linhas: [['Operação', op], ['Valor', R$(v.valorParaQuitar)], ['Data', dataBR(data)]], ok: 'Quitar' }))) return;
          try {
            const { corpo: r } = await api(`/operacoes/${idOp(op)}/liquidacao`, { method: 'POST', body: { valor: v.valorParaQuitar, dataPagamento: data, identificadorPagamento: tokenUnico('web') } });
            $('#aviso', app).innerHTML = aviso('ok', 'Operação liquidada.');
            mostrarSaida(resultado('Operação liquidada', [['Valor pago', R$(r.valor)], ['Situação', ROTULO[r.operacao.status]], ['Saldo devedor', R$(r.operacao.saldoDevedor)]], `<a class="btn escuro" href="#/operacoes/${esc(r.operacao.numeroOperacao)}">${ic('contrato')} Ver operação</a>`));
          } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
          ativarBlocos();
        };
      } catch (er) { mostrarSaida(''); $('#aviso', app).innerHTML = aviso('erro', er.message); }
      ativarBlocos();
    };
  });
};

/* ---------- registrar ---------- */
telas.registrar = async () => {
  const novoNumero = () => `OP-${new Date().getFullYear()}-${String(Math.floor(1000 + Math.random() * 9000))}`;
  const exemplo = () => JSON.stringify(JSON.parse(JSON.stringify(EXEMPLO_JURO)), null, 2);
  montar(titulo({ icone: 'registrar', olho: 'Registro', titulo: 'Registre uma operação.', sub: 'Cole o JSON que o serviço de juros envia: a operação já definida, com o calendário. O exemplo PRICE já vem preenchido.' })
    + linha(celula(`<div class="corpo reveal"><form id="f"><div class="campo"><span class="rot">${ic('contrato')} Payload do juros</span><textarea id="json" spellcheck="false"></textarea></div><div id="aviso"></div>
      <div class="acoes form-acoes"><button class="btn primario" type="submit">${ic('registrar')} Registrar operação</button><button class="btn contorno" type="button" id="novo">Trocar número da operação</button><button class="btn contorno" type="button" id="reset">Voltar ao exemplo</button></div></form></div>`)), (app) => {
    const ta = $('#json', app);
    ta.value = exemplo();
    $('#reset', app).onclick = () => { ta.value = exemplo(); };
    $('#novo', app).onclick = () => { try { const o = JSON.parse(ta.value); o.operacao.identificador = novoNumero(); ta.value = JSON.stringify(o, null, 2); } catch (e) { $('#aviso', app).innerHTML = aviso('erro', 'O JSON não está válido.'); ativarBlocos(); } };
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      let obj;
      try { obj = JSON.parse(ta.value); } catch (er) { $('#aviso', app).innerHTML = aviso('erro', 'O JSON não está válido: ' + er.message); ativarBlocos(); return; }
      try {
        const { corpo: r, status } = await api('/operacoes', { method: 'POST', body: obj });
        $('#aviso', app).innerHTML = aviso('ok', status === 201 ? `Operação ${r.numeroOperacao} registrada.` : `A operação ${r.numeroOperacao} já estava registrada.`);
        ativarBlocos();
        setTimeout(() => (location.hash = '#/operacoes/' + r.numeroOperacao), 900);
      } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); ativarBlocos(); }
    };
  });
};

/* ============ roteador ============ */
const NAV = [['', 'Dashboard', 'dashboard'], ['operacoes', 'Operações', 'operacoes'], ['pagar', 'Pagar', 'pagar'], ['amortizar', 'Amortização', 'amortizar'], ['liquidar', 'Liquidação', 'liquidar'], ['registrar', 'Registrar', 'registrar']];
$('#nav').innerHTML = NAV.map(([r, t, i]) => `<a href="#/${r}" data-r="${r}">${ic(i)} ${t}</a>`).join('');
$('.ico-ref').innerHTML = ic('calendario');
$('#hostRodape').textContent = location.host;

function rotear() {
  const [caminho] = location.hash.replace(/^#\/?/, '').split('?');
  const partes = caminho.split('/').filter(Boolean);
  const meu = ++ciclo;
  const rota = partes[0] || '';
  $$('#nav a').forEach((a) => a.classList.toggle('ativo', a.dataset.r === rota));
  let tarefa;
  if (rota === '') tarefa = telas.dashboard(meu);
  else if (rota === 'operacoes' && partes[1]) tarefa = telas.detalhe(meu, decodeURIComponent(partes[1]), partes[2]);
  else if (telas[rota]) tarefa = telas[rota](meu);
  else tarefa = telas.dashboard(meu);
  Promise.resolve(tarefa).catch((e) => { if (meu === ciclo) falha(e); });
}
window.addEventListener('hashchange', rotear);

$('#dataRef').addEventListener('change', (e) => { estado.dataRef = e.target.value; $('#hoje').hidden = !estado.dataRef; rotear(); });
$('#hoje').addEventListener('click', () => { estado.dataRef = ''; $('#dataRef').value = ''; $('#hoje').hidden = true; rotear(); });

// atualização discreta do dashboard a cada 30 s, sem mexer enquanto a pessoa preenche algo.
setInterval(() => { if ((location.hash === '' || location.hash === '#/') && !$('#camada').innerHTML && document.visibilityState === 'visible') rotear(); }, 30000);
ativarBlocos();
rotear();
</script>
