:root{
  --txt:#1f4647; --txt-2:#5d7778; --verde:#9eea6c; --verde-esc:#5fb82b; --verde-bg:#eefbe5;
  --linha:#E2E7F1; --bg:#f6f8f5; --branco:#fff; --erro:#c0392b; --erro-bg:#fdecea; --alerta:#b7791f; --alerta-bg:#fff6e0;
  --raio:16px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Fustat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.num{font-feature-settings:'tnum' 0}
td.num,td .num,dd.num{font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:20;background:rgba(246,248,245,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;text-decoration:none}
.logo svg{height:34px;width:auto;display:block}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{padding:8px 13px;border-radius:999px;text-decoration:none;font-weight:600;color:var(--txt-2);transition:background .2s var(--ease),color .2s var(--ease)}
.nav a:hover{background:var(--branco);color:var(--txt)}
.nav a.ativo{background:var(--txt);color:var(--branco)}
.ref{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt-2);white-space:nowrap}
.ref input{border:1px solid var(--linha);background:var(--branco);border-radius:10px;padding:6px 9px;font-size:13px}
.ref button{border:0;background:none;color:var(--txt-2);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}

/* ---------- página ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.tela{animation:entra .28s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.titulo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.titulo h1{font-size:30px}
.titulo p{margin:4px 0 0;color:var(--txt-2)}

/* ---------- blocos (a ilusão do index2.html) ---------- */
.blocos{display:grid;gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:0;margin-bottom:24px;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
.blocos.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.blocos.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bloco{background:var(--branco);padding:22px;min-width:0;position:relative;transition:background .25s var(--ease)}
.blocos[style*="grid-template-columns:1fr"]{grid-template-columns:minmax(0,1fr)!important}
.bloco.s2{grid-column:span 2}.bloco.s3{grid-column:span 3}.bloco.s4{grid-column:1/-1}
.bloco.link{cursor:pointer}
.bloco.link:hover{background:#fbfdf9}
.bloco.link:hover .seta{transform:translateX(4px);color:var(--verde-esc)}
.listrado{background-image:repeating-linear-gradient(45deg,rgba(226,231,241,.8) 0 1px,transparent 1px 14px)}
.rotulo{font-size:12.5px;font-weight:600;color:var(--txt-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.grande{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.sub{margin-top:6px;color:var(--txt-2);font-size:13.5px}
.seta{display:inline-block;transition:transform .25s var(--ease),color .25s var(--ease)}
.bloco h2{font-size:18px;margin-bottom:14px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--linha);color:var(--txt);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.chip.ATIVA,.chip.PAGA,.chip.REGISTRADO{background:var(--verde-bg);color:#2f7a12}
.chip.LIQUIDADA{background:var(--txt);color:var(--verde)}
.chip.EM_ATRASO,.chip.VENCIDA,.chip.PARCIALMENTE_PAGA,.chip.CALCULADO{background:var(--alerta-bg);color:var(--alerta)}
.chip.INADIMPLENTE{background:var(--erro-bg);color:var(--erro)}
.chip.PENDENTE{background:var(--linha);color:var(--txt-2)}

/* ---------- barras ---------- */
.barras{display:grid;gap:12px}
.barra{display:grid;grid-template-columns:120px 1fr 34px;align-items:center;gap:12px;font-size:14px}
.trilho{height:10px;background:var(--linha);border-radius:99px;overflow:hidden}
.preench{height:100%;width:0;background:var(--verde);border-radius:99px;transition:width .9s var(--ease)}
.preench.EM_ATRASO{background:#f0b44c}.preench.INADIMPLENTE{background:#e5766b}.preench.LIQUIDADA{background:var(--txt)}

/* ---------- tabelas ---------- */
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-2);font-weight:600;padding:0 12px 10px 0;white-space:nowrap}
td{padding:11px 12px 11px 0;border-top:1px solid var(--linha);vertical-align:middle}
td.dir,th.dir{text-align:right;padding-left:14px;padding-right:0}
th.dir{white-space:nowrap}
tr.clicavel{cursor:pointer;transition:background .2s}
tr.clicavel:hover td{background:#fbfdf9}
.mudo{color:var(--txt-2)}

/* ---------- formulários ---------- */
.form{display:grid;gap:16px}
.campos{display:grid;align-items:start;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
label{display:grid;gap:6px;font-weight:600;font-size:13.5px}
label small{font-weight:400;color:var(--txt-2)}
input,select,textarea{width:100%;border:1px solid var(--linha);background:var(--branco);border-radius:12px;padding:10px 12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde-esc);box-shadow:0 0 0 4px rgba(158,234,108,.28)}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;min-height:340px;resize:vertical}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--txt);background:var(--branco);color:var(--txt);padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease),background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);background:var(--verde-bg)}
.btn:active{transform:none}
.btn.primario{background:var(--verde);border-color:var(--verde)}
.btn.primario:hover{background:#b0f284;box-shadow:0 6px 18px -8px rgba(95,184,43,.7)}
.btn.suave{border-color:var(--linha)}
.btn.mini{padding:5px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.busca{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.busca input{max-width:320px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{border:1px solid var(--linha);background:var(--branco);padding:7px 13px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--txt-2);transition:all .2s}
.filtros button.ativo{background:var(--txt);border-color:var(--txt);color:var(--branco)}

/* ---------- abas ---------- */
.abas{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--linha)}
.abas button{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--txt-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.abas button.ativo{color:var(--txt);border-color:var(--verde)}

/* ---------- avisos ---------- */
.aviso{border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:600;animation:entra .25s var(--ease) both}
.aviso.erro{background:var(--erro-bg);color:var(--erro)}
.aviso.ok{background:var(--verde-bg);color:#2f7a12}
.aviso.info{background:var(--alerta-bg);color:var(--alerta)}
.vazio{text-align:center;padding:42px 12px;color:var(--txt-2)}
.vazio strong{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.carregando{color:var(--txt-2);padding:30px 0;animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.4}}

/* ---------- linha do tempo ---------- */
.linha-tempo{display:grid;gap:0}
.evento{display:grid;grid-template-columns:110px 18px 1fr;gap:14px;padding-bottom:20px}
.evento .data{color:var(--txt-2);font-size:13.5px;padding-top:2px}
.evento .pino{position:relative}
.evento .pino::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--verde-esc);box-shadow:0 0 0 4px var(--verde-bg)}
.evento.CALCULADO .pino::before{background:#f0b44c;box-shadow:0 0 0 4px var(--alerta-bg)}
.evento .pino::after{content:"";position:absolute;left:9px;top:20px;bottom:-24px;width:1px;background:var(--linha)}
.evento:last-child .pino::after{display:none}
.evento h3{font-size:15px;margin-bottom:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evento .det{color:var(--txt-2);font-size:13.5px}

/* ---------- modal ---------- */
.fundo{position:fixed;inset:0;background:rgba(31,70,71,.38);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--branco);border-radius:var(--raio);padding:26px;max-width:460px;width:100%;animation:entra .25s var(--ease) both}
.modal h2{margin-bottom:8px}
.modal p{margin:0 0 18px;color:var(--txt-2)}
.modal .acoes{justify-content:flex-end}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 18px}
.kv dt{color:var(--txt-2)}.kv dd{margin:0;font-weight:700;text-align:right}

.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.atalhos .btn{justify-content:space-between;background:var(--branco)}
.atalhos .btn.primario{background:var(--verde)}
.atalhos .btn:hover .seta{transform:translateX(4px)}
.hero{display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:100%}
.servidor{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ponto{width:9px;height:9px;border-radius:50%;background:#bbb}
.ponto.on{background:var(--verde-esc);box-shadow:0 0 0 0 rgba(95,184,43,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(95,184,43,0)}100%{box-shadow:0 0 0 0 rgba(95,184,43,0)}}

@media (max-width:900px){
  .blocos,.blocos.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bloco.s3,.bloco.s4{grid-column:1/-1}
}
@media (max-width:560px){
  .blocos,.blocos.c2,.blocos.c3{grid-template-columns:minmax(0,1fr)}
  .bloco.s2,.bloco.s3,.bloco.s4{grid-column:auto}
  .evento{grid-template-columns:1fr;gap:2px}.evento .pino{display:none}
  .grande{font-size:27px}.titulo h1{font-size:25px}
  .barra{grid-template-columns:96px 1fr 28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const R$ = (v) => brl.format(Number(v || 0));
const pct = (v) => (Number(v) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%';
const dataBR = (s) => (s ? s.slice(0, 10).split('-').reverse().join('/') : '—');
const hojeISO = () => { const d = new Date(Date.now() - 3 * 3600 * 1000); return d.toISOString().slice(0, 10); };
const ROTULO = { ATIVA: 'Ativa', EM_ATRASO: 'Em atraso', INADIMPLENTE: 'Inadimplente', LIQUIDADA: 'Liquidada', PENDENTE: 'Pendente', PAGA: 'Paga', VENCIDA: 'Vencida', PARCIALMENTE_PAGA: 'Parcial', REGISTRADO: 'Registrado', CALCULADO: 'Calculado' };
const chip = (s) => `<span class="chip ${esc(s)}">${esc(ROTULO[s] || s)}</span>`;
const TIPO = { OPERACAO_REGISTRADA: 'Operação registrada', PAGAMENTO: 'Pagamento', AMORTIZACAO_ANTECIPADA: 'Amortização antecipada', LIQUIDACAO: 'Liquidação', PARCELA_VENCIDA: 'Parcela vencida', OPERACAO_INADIMPLENTE: 'Operação inadimplente' };

const estado = { dataRef: '' };

async function api(caminho, opcoes = {}) {
  const resp = await fetch(caminho, {
    method: opcoes.method || 'GET',
    headers: opcoes.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opcoes.body ? (typeof opcoes.body === 'string' ? opcoes.body : JSON.stringify(opcoes.body)) : undefined,
  });
  let corpo = null;
  try { corpo = await resp.json(); } catch (e) { /* sem corpo */ }
  if (!resp.ok) {
    const erro = new Error((corpo && corpo.erro) || `Erro ${resp.status}`);
    erro.status = resp.status;
    throw erro;
  }
  return { corpo, status: resp.status };
}
const ler = async (c) => (await api(c)).corpo;
const comData = (caminho, extra = '') => {
  const q = [];
  if (estado.dataRef) q.push('dataReferencia=' + estado.dataRef);
  if (extra) q.push(extra);
  return caminho + (q.length ? '?' + q.join('&') : '');
};
const idOp = (v) => encodeURIComponent(String(v).trim());

/* ============ blocos: só a quina que aponta para o centro é arredondada ============ */
function cantos(grade) {
  const cel = $$(':scope > .bloco', grade);
  const r = cel.map((c) => c.getBoundingClientRect());
  const t = 3;
  cel.forEach((c, i) => {
    const a = r[i];
    const viz = (fn) => r.some((b, j) => j !== i && fn(a, b));
    const esq = viz((a, b) => Math.abs(b.right - a.left) < t + 1 && b.top < a.bottom - t && b.bottom > a.top + t);
    const dir = viz((a, b) => Math.abs(b.left - a.right) < t + 1 && b.top < a.bottom - t && b.bottom > a.top + t);
    const cima = viz((a, b) => Math.abs(b.bottom - a.top) < t + 1 && b.left < a.right - t && b.right > a.left + t);
    const baixo = viz((a, b) => Math.abs(b.top - a.bottom) < t + 1 && b.left < a.right - t && b.right > a.left + t);
    const R = '16px';
    c.style.borderTopLeftRadius = esq && cima ? R : '0';
    c.style.borderTopRightRadius = dir && cima ? R : '0';
    c.style.borderBottomLeftRadius = esq && baixo ? R : '0';
    c.style.borderBottomRightRadius = dir && baixo ? R : '0';
  });
}
const observador = new ResizeObserver((entradas) => entradas.forEach((e) => cantos(e.target)));
function ativarBlocos(raiz) {
  $$('.blocos', raiz).forEach((g) => { cantos(g); observador.observe(g); });
}

/* ============ pequenas animações ============ */
function contar(el, alvo, formato) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = formato(alvo); return; }
  const ini = performance.now(), dur = 700;
  const passo = (t) => {
    const p = Math.min(1, (t - ini) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = formato(alvo * e);
    if (p < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}
function animarNumeros(raiz) {
  $$('[data-conta]', raiz).forEach((el) => contar(el, Number(el.dataset.conta), el.dataset.fmt === 'int' ? (v) => String(Math.round(v)) : R$));
  requestAnimationFrame(() => $$('.preench[data-w]', raiz).forEach((el) => { el.style.width = el.dataset.w + '%'; }));
}

/* ============ avisos e confirmação ============ */
function aviso(tipo, texto) { return `<div class="aviso ${tipo}" role="${tipo === 'erro' ? 'alert' : 'status'}">${esc(texto)}</div>`; }
function confirmar({ titulo, texto, linhas = [], ok = 'Confirmar' }) {
  return new Promise((resolve) => {
    const camada = $('#camada');
    camada.innerHTML = `<div class="fundo"><div class="modal" role="dialog" aria-modal="true">
      <h2>${esc(titulo)}</h2><p>${esc(texto || '')}</p>
      ${linhas.length ? `<dl class="kv">${linhas.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="num">${esc(v)}</dd>`).join('')}</dl>` : ''}
      <div class="acoes"><button class="btn suave" data-n>Cancelar</button><button class="btn primario" data-s>${esc(ok)}</button></div></div></div>`;
    const fechar = (v) => { camada.innerHTML = ''; resolve(v); };
    $('[data-n]', camada).onclick = () => fechar(false);
    $('[data-s]', camada).onclick = () => fechar(true);
    $('.fundo', camada).onclick = (e) => { if (e.target.classList.contains('fundo')) fechar(false); };
    $('[data-s]', camada).focus();
  });
}

/* ---------- dashboard ---------- */
async function pool(itens, limite, fn) {
  const saida = new Array(itens.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limite, itens.length) }, async () => {
    while (i < itens.length) { const k = i++; try { saida[k] = await fn(itens[k]); } catch (e) { saida[k] = null; } }
  }));
  return saida;
}

  const kpi = (rot, v, sub, cls = '') => `<div class="bloco ${cls}"><div class="rotulo">${rot}</div><div class="grande num" data-conta="${v}">R$ 0</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  return `<div class="blocos">
    <div class="bloco s2 listrado"><div class="rotulo">Para quitar hoje</div><div class="grande num" data-conta="${r.valorParaQuitar}">R$ 0</div><div class="sub">em ${dataBR(r.dataReferencia)}${r.diasEmAtraso ? ` · ${r.diasEmAtraso} dias de atraso` : ''}</div></div>
    ${kpi('Saldo devedor', r.saldoDevedor)}${kpi('Contratado', r.totalContratado, 'liberado ' + R$(op.valorLiberado))}
    ${kpi('Total pago', r.totalPago, `amortizado ${R$(r.valorAmortizado)}`)}${kpi('Juros pagos', r.jurosPagos)}${kpi('Encargos pagos', r.encargosPagos, 'multa + mora')}
    ${kpi('Vencido', r.valorVencido, `+ ${R$(r.encargosEmAberto)} de encargos`)}${kpi('Previsto no calendário', r.totalPrevisto, 'soma das parcelas originais', 's2')}${kpi('Desconto concedido', r.descontoAntecipacao, 'em antecipações', 's2')}
  </div>`;
}

function descricaoItem(i) {
  if (i.tipo === 'PARCELA_VENCIDA') return `Parcela ${i.numeroParcela} vencida em ${dataBR(i.dataEfeito)}`;
  if (i.tipo === 'OPERACAO_INADIMPLENTE') return `Mais de 90 dias de atraso em ${dataBR(i.dataEfeito)}`;
  return '';
}

function vistaHistorico(itens) {
  if (!itens.length) return '<div class="vazio"><strong>Sem eventos</strong>Esta operação ainda não tem histórico gravado.</div>';
  const dist = (l) => [['multa', l.multa], ['mora', l.jurosMora], ['juros', l.juros], ['amortização', l.amortizacao], ['desconto', l.desconto]].filter(([, v]) => v > 0).map(([k, v]) => `${k} ${R$(v)}`).join(' · ');
  return `<div class="blocos" style="grid-template-columns:1fr"><div class="bloco"><div class="linha-tempo">${itens.map((i) => `
    <div class="evento ${esc(i.origem)}"><div class="data">${dataBR(i.dataEfeito)}</div><div class="pino"></div><div>
      <h3>${esc(TIPO[i.tipo] || i.tipo)} ${chip(i.origem)}${i.valor != null ? ` <span class="num">${R$(i.valor)}</span>` : ''}</h3>
      <div class="det">${esc(descricaoItem(i))}${i.identificadorPagamento ? ` · id ${esc(i.identificadorPagamento)}` : ''}${i.origemPagamento ? ` · ${esc(i.origemPagamento)}` : ''}${i.registradoEm ? `${i.tipo === 'OPERACAO_REGISTRADA' ? '' : ' · '}registrado em ${new Date(i.registradoEm).toLocaleString('pt-BR')}` : ''}</div>
      ${(i.lancamentos || []).map((l) => `<div class="det">${l.numeroParcela ? 'Parcela ' + l.numeroParcela : 'Parcelas a vencer'}: ${dist(l)}</div>`).join('')}
    </div></div>`).join('')}</div></div></div>`;
}

  const lista = await opcoesDeOperacao();
  if (meu !== ciclo) return;
  montar(`<div class="titulo"><div><h1>Pagar parcela</h1><p>Vale para as parcelas vencidas e a próxima a vencer. O valor abate multa, mora, juros e amortização, nessa ordem.</p></div></div>
    <div class="blocos" style="grid-template-columns:1fr"><div class="bloco"><form class="form" id="f"><div class="campos">
      ${campoOp(lista, p.get('op') || '')}
      <label>Parcela<select id="parcela" disabled><option>Escolha a operação</option></select><small id="dicaParcela"></small></label>
      <label>Valor (R$)<input id="valor" inputmode="decimal" placeholder="0,00" required></label>
      ${campoData('data', 'Data do pagamento')}
      <label><span>Origem <small>(opcional)</small></span><input id="origem" maxlength="30" placeholder="CLIENTE, BOLETO, INSS…"></label>
    </div><div id="aviso"></div><div class="acoes"><button class="btn primario" type="submit">Registrar pagamento</button><button class="btn suave" type="button" id="quitar" disabled>Preencher valor para quitar</button></div></form>
    <div id="saida"></div></div></div>`, (app) => {
    let parcelas = [];
    const dica = () => {
      const par = parcelas.find((x) => String(x.numero) === $('#parcela', app).value);
      $('#quitar', app).disabled = !par;
      $('#dicaParcela', app).textContent = par ? `Para quitar em ${dataBR(estado.dataRef || hojeISO())}: ${R$(par.totalParaQuitar)}` : '';
    };
    const carregarParcelas = async (limpar = true) => {
      const sel = $('#parcela', app), op = $('#op', app).value.trim();
      if (!op) return;
      try {
        parcelas = (await ler(comData(`/operacoes/${idOp(op)}/parcelas`, estado.dataRef ? '' : ''))).filter((x) => x.status !== 'PAGA');
        sel.disabled = !parcelas.length;
        sel.innerHTML = parcelas.length ? parcelas.map((x) => `<option value="${x.numero}">${x.numero} · vence ${dataBR(x.vencimento)} · ${ROTULO[x.status]}</option>`).join('') : '<option>Todas pagas</option>';
        if (p.get('parcela') && parcelas.some((x) => String(x.numero) === p.get('parcela'))) sel.value = p.get('parcela');
        if (limpar) $('#aviso', app).innerHTML = '';
      } catch (e) { sel.disabled = true; sel.innerHTML = '<option>—</option>'; parcelas = []; $('#aviso', app).innerHTML = aviso('erro', e.message); }
      dica();
    };
    $('#op', app).onchange = carregarParcelas;
    $('#parcela', app).onchange = dica;
    $('#quitar', app).onclick = () => { const par = parcelas.find((x) => String(x.numero) === $('#parcela', app).value); if (par) $('#valor', app).value = String(par.totalParaQuitar).replace('.', ','); };
    if ($('#op', app).value) carregarParcelas();
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      const op = $('#op', app).value.trim(), num = $('#parcela', app).value, valor = Math.round(paraNumero($('#valor', app).value) * 100) / 100;
      const data = $('#data', app).value, origem = $('#origem', app).value.trim();
      if (!(valor > 0)) { $('#aviso', app).innerHTML = aviso('erro', 'Informe um valor maior que zero.'); return; }
      if (!(await confirmar({ titulo: 'Registrar pagamento?', texto: 'O pagamento fica gravado no histórico e não pode ser desfeito.', linhas: [['Operação', op], ['Parcela', num], ['Valor', R$(valor)], ['Data', dataBR(data)]], ok: 'Registrar' }))) return;
      const corpo = { valor, dataPagamento: data, identificadorPagamento: tokenUnico('web') };
      if (origem) corpo.origem = origem;
      try {
        const { corpo: r, status } = await api(`/operacoes/${idOp(op)}/parcelas/${num}/pagamentos`, { method: 'POST', body: corpo });
        $('#aviso', app).innerHTML = aviso('ok', status === 201 ? 'Pagamento registrado.' : 'Esse pagamento já estava registrado.');
        $('#saida', app).innerHTML = resultadoBloco('Como o dinheiro foi aplicado', [['Multa', R$(r.distribuicao.multa)], ['Juros de mora', R$(r.distribuicao.jurosMora)], ['Juros', R$(r.distribuicao.juros)], ['Amortização', R$(r.distribuicao.amortizacao)],
          ['Parcela ' + r.parcela.numero, (ROTULO[r.parcela.status] || r.parcela.status) + ' · falta ' + R$(r.parcela.valorEmAberto + r.parcela.encargosEmAberto)], ['Situação da operação', ROTULO[r.operacao.status] || r.operacao.status], ['Saldo devedor', R$(r.operacao.saldoDevedor)]],
          `<div class="acoes"><a class="btn" href="#/operacoes/${esc(r.operacao.numeroOperacao)}">Ver operação</a></div>`);
        ativarBlocos($('#saida', app));
        carregarParcelas(false);
      } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
    };
  });
};

/* ---------- amortizar ---------- */
telas.amortizar = async (meu) => {
  const p = paramsDaRota();
  const lista = await opcoesDeOperacao();
  if (meu !== ciclo) return;
  montar(`<div class="titulo"><div><h1>Amortização antecipada</h1><p>Quita as últimas parcelas pelo valor presente, com desconto dos juros que ainda não correram. Só vale sem parcela vencida.</p></div></div>
    <div class="blocos" style="grid-template-columns:1fr"><div class="bloco"><form class="form" id="f"><div class="campos">
      ${campoOp(lista, p.get('op') || '')}
      <label>Quantas parcelas<input id="qtd" type="number" min="1" step="1" value="2" required></label>
      ${campoData('data', 'Data', 'Vale para a simulação e para o pagamento')}
    </div><div id="aviso"></div><div class="acoes"><button class="btn primario" type="submit">Simular</button></div></form><div id="saida"></div></div></div>`, (app) => {
    const ler3 = () => ({ op: $('#op', app).value.trim(), qtd: Number($('#qtd', app).value), data: $('#data', app).value });
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      const { op, qtd, data } = ler3();
      try {
        const s = await ler(`/operacoes/${idOp(op)}/amortizacoes/simulacao?quantidadeParcelas=${qtd}&dataReferencia=${data}`);
        $('#aviso', app).innerHTML = '';
        $('#saida', app).innerHTML = `<div class="blocos" style="grid-template-columns:1fr;margin-top:20px"><div class="bloco listrado"><h2>Simulação</h2>
          <div class="tabela-wrap"><table><thead><tr><th>#</th><th>Vencimento</th><th class="dir">Valor da parcela</th><th class="dir">Valor presente</th><th class="dir">Desconto</th><th class="dir">Amortização</th><th class="dir">Juros</th></tr></thead><tbody>
          ${s.parcelas.map((x) => `<tr><td><strong>${x.numero}</strong></td><td>${dataBR(x.vencimento)}</td><td class="dir num">${R$(x.valorParcela)}</td><td class="dir num">${R$(x.valorPresente)}</td><td class="dir num">${R$(x.desconto)}</td><td class="dir num">${R$(x.amortizacao)}</td><td class="dir num">${R$(x.juros)}</td></tr>`).join('')}</tbody></table></div>
          <dl class="kv" style="margin-top:16px"><dt>Total a pagar</dt><dd class="num">${R$(s.totais.valorAPagar)}</dd><dt>Desconto total</dt><dd class="num">${R$(s.totais.desconto)}</dd><dt>Saldo devedor</dt><dd class="num">${R$(s.saldoDevedorAntes)} → ${R$(s.saldoDevedorApos)}</dd><dt>Parcelas que continuam</dt><dd>${s.quantidadeParcelasRestantes}</dd></dl>
          <div class="acoes"><button class="btn primario" id="confirmar">Confirmar amortização</button></div></div></div>`;
        ativarBlocos($('#saida', app));
        $('#confirmar', app).onclick = async () => {
          if (!(await confirmar({ titulo: 'Registrar amortização?', texto: 'As parcelas ficam quitadas e a tabela das que sobram é recalculada.', linhas: [['Operação', op], ['Parcelas', String(qtd)], ['Total a pagar', R$(s.totais.valorAPagar)], ['Data', dataBR(data)]], ok: 'Registrar' }))) return;
          try {
            const { corpo: r } = await api(`/operacoes/${idOp(op)}/amortizacoes`, { method: 'POST', body: { quantidadeParcelas: qtd, dataPagamento: data, identificadorPagamento: tokenUnico('web') } });
            $('#aviso', app).innerHTML = aviso('ok', 'Amortização registrada.');
            $('#saida', app).innerHTML = resultadoBloco('Amortização registrada', [['Parcelas quitadas', r.lancamentos.map((x) => x.numero).join(', ')], ['Total pago', R$(r.totais.valorAPagar)], ['Desconto', R$(r.totais.desconto)], ['Saldo devedor', R$(r.saldoDevedorAntes) + ' → ' + R$(r.saldoDevedorApos)]],
              `<div class="acoes"><a class="btn" href="#/operacoes/${esc(r.numeroOperacao)}">Ver operação</a></div>`);
            ativarBlocos($('#saida', app));
          } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
        };
      } catch (er) { $('#saida', app).innerHTML = ''; $('#aviso', app).innerHTML = aviso('erro', er.message); }
    };
  });
};

/* ---------- liquidar ---------- */
telas.liquidar = async (meu) => {
  const p = paramsDaRota();
  const lista = await opcoesDeOperacao();
  if (meu !== ciclo) return;
  montar(`<div class="titulo"><div><h1>Liquidação antecipada</h1><p>Quita a operação inteira: parcelas vencidas com encargos mais as a vencer pelo valor presente, sem tarifa.</p></div></div>
    <div class="blocos" style="grid-template-columns:1fr"><div class="bloco"><form class="form" id="f"><div class="campos">
      ${campoOp(lista, p.get('op') || '')}${campoData('data', 'Data', 'Vale para a consulta e para o pagamento')}
    </div><div id="aviso"></div><div class="acoes"><button class="btn primario" type="submit">Ver valor para quitar</button></div></form><div id="saida"></div></div></div>`, (app) => {
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      const op = $('#op', app).value.trim(), data = $('#data', app).value;
      try {
        const v = await ler(`/operacoes/${idOp(op)}/liquidacao?dataReferencia=${data}`);
        $('#aviso', app).innerHTML = '';
        $('#saida', app).innerHTML = `<div class="blocos c3" style="margin-top:20px">
          <div class="bloco s2 listrado"><div class="rotulo">Valor para quitar em ${dataBR(v.dataReferencia)}</div><div class="grande num">${R$(v.valorParaQuitar)}</div><div class="sub">saldo devedor ${R$(v.saldoDevedor)}</div></div>
          <div class="bloco"><div class="rotulo">Desconto</div><div class="grande num">${R$(v.aVencer.desconto)}</div><div class="sub">sobre ${R$(v.aVencer.valorNominal)} a vencer</div></div>
          <div class="bloco"><div class="rotulo">Vencidas (${v.vencidas.parcelas.length})</div><div class="grande num">${R$(v.vencidas.total)}</div><div class="sub">com multa e mora</div></div>
          <div class="bloco s2"><div class="rotulo">A vencer (${v.aVencer.parcelas.length}) pelo valor presente</div><div class="grande num">${R$(v.aVencer.valorPresente)}</div><div class="sub">principal ${R$(v.aVencer.amortizacao)} + juros ${R$(v.aVencer.juros)}</div></div>
          <div class="bloco s3"><div class="acoes"><button class="btn primario" id="quitar">Quitar operação</button></div></div></div>`;
        ativarBlocos($('#saida', app));
        $('#quitar', app).onclick = async () => {
          if (!(await confirmar({ titulo: 'Quitar a operação?', texto: 'Todas as parcelas ficam pagas e a operação é liquidada. Não pode ser desfeito.', linhas: [['Operação', op], ['Valor', R$(v.valorParaQuitar)], ['Data', dataBR(data)]], ok: 'Quitar' }))) return;
          try {
            const { corpo: r } = await api(`/operacoes/${idOp(op)}/liquidacao`, { method: 'POST', body: { valor: v.valorParaQuitar, dataPagamento: data, identificadorPagamento: tokenUnico('web') } });
            $('#aviso', app).innerHTML = aviso('ok', 'Operação liquidada.');
            $('#saida', app).innerHTML = resultadoBloco('Operação liquidada', [['Valor pago', R$(r.valor)], ['Situação', ROTULO[r.operacao.status]], ['Saldo devedor', R$(r.operacao.saldoDevedor)]], `<div class="acoes"><a class="btn" href="#/operacoes/${esc(r.operacao.numeroOperacao)}">Ver operação</a></div>`);
            ativarBlocos($('#saida', app));
          } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
        };
      } catch (er) { $('#saida', app).innerHTML = ''; $('#aviso', app).innerHTML = aviso('erro', er.message); }
    };
  });
};

/* ---------- registrar ---------- */
telas.registrar = async () => {
  const novoNumero = () => `OP-${new Date().getFullYear()}-${String(Math.floor(1000 + Math.random() * 9000))}`;
  const exemplo = () => { const c = JSON.parse(JSON.stringify(EXEMPLO_JURO)); return JSON.stringify(c, null, 2); };
  montar(`<div class="titulo"><div><h1>Registrar operação</h1><p>Cole o JSON que o serviço de juros envia (a operação já definida, com o calendário). O exemplo PRICE já vem preenchido.</p></div></div>
    <div class="blocos" style="grid-template-columns:1fr"><div class="bloco"><form class="form" id="f">
      <label>Payload do juros<textarea id="json" spellcheck="false"></textarea></label>
      <div id="aviso"></div>
      <div class="acoes"><button class="btn primario" type="submit">Registrar operação</button><button class="btn suave" type="button" id="novo">Trocar número da operação</button><button class="btn suave" type="button" id="reset">Voltar ao exemplo</button></div>
    </form></div></div>`, (app) => {
    const ta = $('#json', app);
    ta.value = exemplo();
    $('#reset', app).onclick = () => { ta.value = exemplo(); };
    $('#novo', app).onclick = () => { try { const o = JSON.parse(ta.value); o.operacao.identificador = novoNumero(); ta.value = JSON.stringify(o, null, 2); } catch (e) { $('#aviso', app).innerHTML = aviso('erro', 'O JSON não está válido.'); } };
    $('#f', app).onsubmit = async (e) => {
      e.preventDefault();
      let obj;
      try { obj = JSON.parse(ta.value); } catch (er) { $('#aviso', app).innerHTML = aviso('erro', 'O JSON não está válido: ' + er.message); return; }
      try {
        const { corpo: r, status } = await api('/operacoes', { method: 'POST', body: obj });
        $('#aviso', app).innerHTML = aviso('ok', status === 201 ? `Operação ${r.numeroOperacao} registrada.` : `A operação ${r.numeroOperacao} já estava registrada.`);
        setTimeout(() => (location.hash = '#/operacoes/' + r.numeroOperacao), 900);
      } catch (er) { $('#aviso', app).innerHTML = aviso('erro', er.message); }
    };
  });
};

/* ============ roteador ============ */
function rotear() {
  const [caminho] = location.hash.replace(/^#\/?/, '').split('?');
  const partes = caminho.split('/').filter(Boolean);
  const meu = ++ciclo;
  const rota = partes[0] || '';
  $$('#nav a').forEach((a) => a.classList.toggle('ativo', a.dataset.r === rota || (rota === 'operacoes' && a.dataset.r === 'operacoes')));
  let tarefa;
  if (rota === '') tarefa = telas.dashboard(meu);
  else if (rota === 'operacoes' && partes[1]) tarefa = telas.detalhe(meu, decodeURIComponent(partes[1]), partes[2]);
  else if (telas[rota]) tarefa = telas[rota](meu);
  else tarefa = telas.dashboard(meu);
  Promise.resolve(tarefa).catch((e) => { if (meu === ciclo) falha(e); });
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', rotear);

$('#dataRef').addEventListener('change', (e) => { estado.dataRef = e.target.value; rotear(); });
$('#hoje').addEventListener('click', () => { estado.dataRef = ''; $('#dataRef').value = ''; rotear(); });

// atualização discreta do dashboard a cada 30 s, sem mexer enquanto a pessoa preenche algo.
setInterval(() => { if ((location.hash === '' || location.hash === '#/') && !$('#camada').innerHTML && document.visibilityState === 'visible') rotear(); }, 30000);
rotear();
</script>
