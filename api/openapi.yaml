  responses:
    IdentificadorInvalido:
      description: O identificador não é um id nem um número de operação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
    NaoEncontrada:
      description: Operação não encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            erro: operação não encontrada
    ErroInterno:
      description: |
        Falha inesperada, como erro de banco. Hoje é devolvida como `400`, com a mensagem original do erro; a separação em `500` está prevista.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string
          description: Mensagem em português, direcionada a quem consome a API.
          example: operação não encontrada

    Dinheiro:
      type: number
      minimum: 0
      description: Valor em reais, com no máximo 2 casas decimais.

    Percentual:
      type: number
      minimum: 0
      description: Percentual como o juros envia (`1.85` = 1,85%), com no máximo 4 casas decimais.

    CriarOperacaoRequest:
      type: object
      description: Payload do serviço de juros. Campos não listados aqui são aceitos e ignorados.
      required: [operacao, cliente, produto, condicoes, taxa, sistema, resumo, encargos, valorLiberado, cet, calendario]
      properties:
        operacao:
          type: object
          required: [identificador, estado, definidoEm]
          properties:
            identificador:
              type: string
              pattern: '^[Oo][Pp]-[0-9]{4}-[0-9]{4,}$'
              description: Identificador da operação em toda a esteira. Vira o `numeroOperacao`. Repetido = reenvio (`200`).
              example: OP-2026-0001
            estado:
              type: string
              enum: [DEFINIDA]
              description: Só operações definidas com o cliente são registradas. Aceito também em minúsculas.
            definidoEm:
              type: string
              description: "`YYYY-MM-DD HH:MM:SS`, interpretado como GMT-03:00, ou ISO-8601 com fuso (`2026-10-08T15:12:40-03:00`)."
              example: "2026-10-08 15:12:40"
        cliente:
          type: object
          required: [tipoPessoa, documento]
          properties:
            tipoPessoa:
              type: string
              enum: [PF, PJ]
              description: Aceito também em minúsculas.
            documento:
              type: string
              pattern: '^[0-9]{11}([0-9]{3})?$'
              description: CPF (11 dígitos, PF) ou CNPJ (14 dígitos, PJ), só números. Vira o `clienteId`.
              example: "52998224725"
        produto:
          type: object
          required: [codigo, nome, modalidadeBcb]
          properties:
            codigo:
              type: string
              maxLength: 50
              example: CONSIGNADO_INSS
            nome:
              type: string
              maxLength: 100
              example: Crédito pessoal consignado INSS
            modalidadeBcb:
              type: string
              maxLength: 150
              example: Crédito pessoal consignado INSS - Prefixado
        condicoes:
          type: object
          required: [valor, prazoMeses, dataLiberacao]
          properties:
            valor:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: Valor do crédito, maior que zero. Vira o `valorAprovado` e o `saldoDevedor` inicial.
              example: 10000
            prazoMeses:
              type: integer
              minimum: 1
              maximum: 420
              description: Deve ser igual à quantidade de parcelas do `calendario`.
              example: 12
            dataLiberacao:
              type: string
              format: date
              description: O primeiro vencimento deve ser posterior a ela.
              example: "2026-10-30"
        taxa:
          type: object
          required: [faixaRisco, taxaFinalMes, taxaFinalAno, tetoAplicado]
          properties:
            faixaRisco:
              type: string
              maxLength: 10
              description: Faixa de preço do juros (não é a faixa de risco do score).
              example: B
            taxaFinalMes:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              maximum: 100
              exclusiveMaximum: true
              example: 1.85
            taxaFinalAno:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              example: 24.6
            tetoAplicado:
              type: boolean
              example: true
        sistema:
          type: string
          enum: [PRICE, SAC]
          description: Sistema que o cliente escolheu. Aceito também em minúsculas.
        resumo:
          type: object
          required: [totalJuros, totalPago]
          description: Não é gravado; só é conferido contra o `calendario`.
          properties:
            totalJuros:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: Soma dos `juros` do calendário.
              example: 1242.88
            totalPago:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: Soma dos `valor` do calendário.
              example: 11242.88
        encargos:
          type: object
          required: [iof, tarifaCadastro, total]
          description: Descontados na liberação, não entram no saldo devedor.
          properties:
            iof:
              type: object
              required: [diario, adicional, total]
              properties:
                diario:
                  $ref: "#/components/schemas/Dinheiro"
                adicional:
                  $ref: "#/components/schemas/Dinheiro"
                total:
                  allOf:
                    - $ref: "#/components/schemas/Dinheiro"
                  description: "`diario + adicional`."
            tarifaCadastro:
              $ref: "#/components/schemas/Dinheiro"
            total:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: "`iof.total + tarifaCadastro`."
        valorLiberado:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "`condicoes.valor - encargos.total`, maior que zero."
          example: 9744.35
        cet:
          type: object
          required: [mensalPercentual, anualPercentual]
          properties:
            mensalPercentual:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              example: 2.27
            anualPercentual:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              example: 30.89
        calendario:
          type: array
          minItems: 1
          maxItems: 420
          description: |
            Gravado como veio, sem recálculo. Precisa fechar: `numero` de 1 a n, vencimentos crescentes (o primeiro depois da `dataLiberacao`), `valor = amortizacao + juros`, `saldoDevedor` encadeado a partir de `condicoes.valor` e `0` na última.
          items:
            $ref: "#/components/schemas/ParcelaJuros"

    ParcelaJuros:
      type: object
      required: [numero, amortizacao, juros, valor, saldoDevedor, vencimento]
      properties:
        numero:
          type: integer
          minimum: 1
          example: 1
        amortizacao:
          $ref: "#/components/schemas/Dinheiro"
        juros:
          $ref: "#/components/schemas/Dinheiro"
        valor:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: Vira o `valorParcela`.
        saldoDevedor:
          $ref: "#/components/schemas/Dinheiro"
        vencimento:
          type: string
          format: date
          example: "2026-11-30"

    OperacaoCriada:
      type: object
      required: [id, numeroOperacao, status, criadoEm]
      properties:
        id:
          type: integer
          format: int64
          description: Identificador técnico, sequencial, gerado por este serviço.
          example: 1
        numeroOperacao:
          type: string
          pattern: '^OP-[0-9]{4}-[0-9]{4,}$'
          example: OP-2026-0001
        status:
          $ref: "#/components/schemas/StatusOperacao"
        criadoEm:
          type: string
          format: date-time
          example: "2026-10-10T17:32:14Z"

    Operacao:
      type: object
      required: [id, numeroOperacao, clienteId, tipoPessoa, status, diasEmAtraso, definidoEm, dataLiberacao, saldoDevedor, produto, condicoesFinanceiras, encargos, valorLiberado, cet, criadoEm]
      properties:
        id:
          type: integer
          format: int64
          description: Identificador técnico, sequencial, gerado por este serviço.
          example: 1
        numeroOperacao:
          type: string
          pattern: '^OP-[0-9]{4}-[0-9]{4,}$'
          description: O `identificador` enviado pelo serviço de juros, o mesmo em toda a esteira.
          example: OP-2026-0001
        clienteId:
          type: string
          description: CPF ou CNPJ, só números.
          example: "52998224725"
        tipoPessoa:
          type: string
          enum: [PF, PJ]
        status:
          $ref: "#/components/schemas/StatusOperacao"
        diasEmAtraso:
          type: integer
          minimum: 0
          description: Maior atraso, em dias corridos, entre as parcelas em aberto na `dataReferencia` (RN-10). É `0` quando não há parcela vencida e nas operações `LIQUIDADA`. Calculado na consulta, nunca gravado.
          example: 0
        definidoEm:
          type: string
          format: date-time
          description: Quando a operação foi definida no juros, em UTC.
          example: "2026-10-08T18:12:40Z"
        dataLiberacao:
          type: string
          format: date
          example: "2026-10-30"
        saldoDevedor:
          type: number
          description: Por enquanto é igual ao `valorAprovado`.
          example: 10000
        produto:
          type: object
          required: [codigo, nome, modalidadeBcb]
          properties:
            codigo:
              type: string
              example: CONSIGNADO_INSS
            nome:
              type: string
              example: Crédito pessoal consignado INSS
            modalidadeBcb:
              type: string
              example: Crédito pessoal consignado INSS - Prefixado
        condicoesFinanceiras:
          $ref: "#/components/schemas/CondicoesFinanceiras"
        encargos:
          type: object
          required: [iof, tarifaCadastro, total]
          properties:
            iof:
              type: object
              required: [diario, adicional, total]
              properties:
                diario:
                  type: number
                  example: 167.65
                adicional:
                  type: number
                  example: 38
                total:
                  type: number
                  example: 205.65
            tarifaCadastro:
              type: number
              example: 50
            total:
              type: number
              example: 255.65
        valorLiberado:
          type: number
          example: 9744.35
        cet:
          type: object
          required: [mensal, anual]
          description: Custo efetivo total, em fração.
          properties:
            mensal:
              type: number
              example: 0.0227
            anual:
              type: number
              example: 0.3089
        criadoEm:
          type: string
          format: date-time
          description: Momento do registro neste serviço, em UTC.
          example: "2026-10-08T18:13:02Z"

    CondicoesFinanceiras:
      type: object
      required: [valorAprovado, prazoMeses, quantidadeParcelas, taxaJuros, taxaJurosAnual, faixaRisco, tetoAplicado, sistemaAmortizacao, primeiroVencimento]
      properties:
        valorAprovado:
          type: number
          example: 10000
        prazoMeses:
          type: integer
          example: 12
        quantidadeParcelas:
          type: integer
          example: 12
        taxaJuros:
          type: number
          description: Taxa mensal em fração (`0.0185` = 1,85% ao mês).
          example: 0.0185
        taxaJurosAnual:
          type: number
          description: Taxa anual em fração.
          example: 0.246
        faixaRisco:
          type: string
          description: Faixa de preço do juros.
          example: B
        tetoAplicado:
          type: boolean
          example: true
        sistemaAmortizacao:
          type: string
          enum: [PRICE, SAC]
        primeiroVencimento:
          type: string
          format: date
          example: "2026-11-30"

    Parcela:
      type: object
      required: [numero, vencimento, valorParcela, amortizacao, juros, saldoDevedor, status, valorEmAberto, diasEmAtraso, encargos, totalParaQuitar]
      properties:
        numero:
          type: integer
          minimum: 1
          example: 1
        vencimento:
          type: string
          format: date
          example: "2026-11-30"
        valorParcela:
          type: number
          description: "`amortizacao + juros`, como veio do juros."
          example: 936.91
        amortizacao:
          type: number
          description: Parte do principal paga na parcela.
          example: 751.91
        juros:
          type: number
          description: Juros do período.
          example: 185
        saldoDevedor:
          type: number
          description: Saldo após a parcela. É `0` na última.
          example: 9248.09
        valorEmAberto:
          type: number
          minimum: 0
          description: Juros + amortização menos juros pagos, amortização paga e desconto concedido (RN-13). Sem multa nem mora. PAGA sempre tem zero. Valor em reais, até duas casas decimais.
          example: 936.91
        diasEmAtraso:
          type: integer
          minimum: 0
          description: Dias corridos entre vencimento e dataReferencia quando vencida (RN-10). Zero no vencimento, antes dele ou se PAGA.
          example: 10
        encargos:
          $ref: "#/components/schemas/EncargosParcela"
        totalParaQuitar:
          type: number
          minimum: 0
          description: Valor em aberto + encargos.total na dataReferencia (RN-13), em reais, até duas casas. Zero para PAGA. Não é a liquidação antecipada da operação (RN-18).
          example: 958.77
        status:
          $ref: "#/components/schemas/StatusParcela"


    ParcelaAmortizada:
      type: object
      description: |
        Uma parcela antecipada. `valorPresente = amortizacao + juros` e `desconto = valorParcela − valorPresente`. No evento, o `valorPresente` é o valor lançado para a parcela.
      required: [numero, vencimento, valorParcela, valorPresente, desconto, amortizacao, juros]
      properties:
        numero:
          type: integer
          minimum: 1
          example: 11
        vencimento:
          type: string
          format: date
          example: "2027-09-30"
        valorParcela:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Valor da parcela no calendário."
          example: 936.91
        valorPresente:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Quanto vale a parcela na data, a ser paga por ela."
          example: 794.42
        desconto:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "`valorParcela − valorPresente`."
          example: 142.49
        amortizacao:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Parte de principal do valor presente."
          example: 794.42
        juros:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Juros pro rata do período em curso. É `0` no dia de um vencimento."
          example: 0

    TotaisAmortizacao:
      type: object
      description: Soma das parcelas antecipadas.
      required: [valorParcelas, desconto, valorPresente, amortizacao, juros, valorAPagar]
      properties:
        valorParcelas:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Soma dos `valorParcela`."
          example: 1873.78
        desconto:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Soma dos `desconto`."
          example: 299.41
        valorPresente:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Soma dos `valorPresente`."
          example: 1574.37
        amortizacao:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Soma das `amortizacao`."
          example: 1574.37
        juros:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Soma dos `juros` pro rata."
          example: 0
        valorAPagar:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Total a pagar pela antecipação, igual ao `valorPresente`."
          example: 1574.37

    SimulacaoAmortizacao:
      type: object
      required: [numeroOperacao, dataReferencia, quantidadeParcelas, parcelas, totais, saldoDevedorAntes, saldoDevedorApos, quantidadeParcelasRestantes]
      properties:
        numeroOperacao:
          type: string
          example: OP-2026-0001
        dataReferencia:
          type: string
          format: date
          example: "2026-12-30"
        quantidadeParcelas:
          type: integer
          minimum: 1
          example: 2
        parcelas:
          type: array
          description: As parcelas que seriam antecipadas, da menor para a maior.
          items:
            $ref: "#/components/schemas/ParcelaAmortizada"
        totais:
          $ref: "#/components/schemas/TotaisAmortizacao"
        saldoDevedorAntes:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Saldo devedor da operação antes da antecipação."
          example: 8482.27
        saldoDevedorApos:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Saldo devedor depois da antecipação: `saldoDevedorAntes − totais.amortizacao`."
          example: 6907.9
        quantidadeParcelasRestantes:
          type: integer
          minimum: 1
          description: Parcelas que continuam em aberto depois da antecipação.
          example: 8

    AmortizacaoRequest:
      type: object
      required: [quantidadeParcelas]
      properties:
        quantidadeParcelas:
          type: integer
          minimum: 1
          description: Quantas das últimas parcelas em aberto antecipar.
          example: 2
        dataPagamento:
          type: string
          format: date
          description: Dia do pagamento, `YYYY-MM-DD`. Sem o campo, vale hoje (RN-09). Não pode ser futura, nem anterior à `dataLiberacao` ou ao último pagamento.
          example: "2026-12-30"
        identificadorPagamento:
          type: string
          maxLength: 50
          description: Opcional. Chave de idempotência por operação; reenviar o mesmo devolve o registro já gravado.
          example: PAG-2026-0003

    AmortizacaoRegistrada:
      type: object
      required: [eventoId, tipo, numeroOperacao, dataPagamento, quantidadeParcelas, lancamentos, totais, saldoDevedorAntes, saldoDevedorApos, quantidadeParcelasRestantes]
      properties:
        eventoId:
          type: integer
          format: int64
          example: 4
        tipo:
          type: string
          enum: [AMORTIZACAO_ANTECIPADA]
        numeroOperacao:
          type: string
          example: OP-2026-0001
        identificadorPagamento:
          type: string
          description: Só aparece quando foi enviado na requisição.
          example: PAG-2026-0003
        dataPagamento:
          type: string
          format: date
          example: "2026-12-30"
        quantidadeParcelas:
          type: integer
          minimum: 1
          example: 2
        lancamentos:
          type: array
          description: Um lançamento por parcela quitada, da menor para a maior.
          items:
            $ref: "#/components/schemas/ParcelaAmortizada"
        totais:
          $ref: "#/components/schemas/TotaisAmortizacao"
        saldoDevedorAntes:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Saldo devedor da operação antes da antecipação."
          example: 8482.27
        saldoDevedorApos:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Saldo devedor depois da antecipação: `saldoDevedorAntes − totais.amortizacao`."
          example: 6907.9
        quantidadeParcelasRestantes:
          type: integer
          minimum: 1
          description: Parcelas que continuam em aberto. A tabela recalculada sai em `GET /operacoes/{identificador}/parcelas`.
          example: 8

    EncargosParcela:
      type: object
      description: Encargos por atraso em aberto na dataReferencia (RN-13), em reais, até duas casas. Todos os campos sempre presentes, inclusive zerados.
      required: [multa, jurosMora, total]
      properties:
        multa:
          type: number
          minimum: 0
          description: Multa de 2% da base do primeiro dia de atraso, fixada e arredondada ao centavo, menos multa paga. Zero sem atraso ou para PAGA.
          example: 18.74
        jurosMora:
          type: number
          minimum: 0
          description: Mora simples acumulada (1% x base x dias / 30 por trecho), arredondada somente ao final, menos mora paga. Zero sem atraso ou para PAGA.
          example: 3.12
        total:
          type: number
          minimum: 0
          description: Soma de multa e jurosMora em aberto após os pagamentos de cada componente.
          example: 21.86

    StatusOperacao:
      type: string
      enum: [ATIVA, EM_ATRASO, INADIMPLENTE, RENEGOCIADA, LIQUIDADA]
      description: |
        Calculado na consulta, para a `dataReferencia`, e nunca gravado (RN-11 e RN-12), exceto `LIQUIDADA`:

        - `ATIVA`: nenhuma parcela vencida em aberto;
        - `EM_ATRASO`: alguma parcela vencida há 1 a 90 dias;
        - `INADIMPLENTE`: alguma parcela vencida há mais de 90 dias;
        - `LIQUIDADA`: quitada; continua `LIQUIDADA` em qualquer data de referência;
        - `RENEGOCIADA`: prevista, depende de outro grupo.

    StatusParcela:
      type: string
      enum: [PENDENTE, PAGA, PARCIALMENTE_PAGA, VENCIDA]
      description: VENCIDA quando não paga por inteiro e dataReferencia posterior ao vencimento (RN-10 e RN-11), prevalecendo sobre PENDENTE e PARCIALMENTE_PAGA na resposta. PAGA permanece PAGA. O estado calculado não é gravado.

    PagamentoRequest:
      type: object
      required: [valor]
      properties:
        valor:
          type: number
          description: Maior que zero, até 2 casas. Não pode passar do total para quitar a parcela na `dataPagamento` (valor em aberto + encargos em aberto).
          example: 500
        dataPagamento:
          type: string
          format: date
          description: RN-09, dia em que o dinheiro entrou (GMT-03:00). Omitida, vale hoje. Não pode ser futura, anterior à `dataLiberacao` nem anterior à última movimentação financeira da operação.
          example: "2026-12-10"
        identificadorPagamento:
          type: string
          maxLength: 50
          description: Opcional. Identificador de quem chama; repetido na mesma operação = reenvio (`200`, nada é gravado).
          example: app-7f3a91
        origem:
          type: string
          maxLength: 30
          description: Opcional, texto livre (`CLIENTE`, `INSS`, `BOLETO`…). Só vai para o histórico.
          example: CLIENTE

    Distribuicao:
      type: object
      description: Para onde foi o dinheiro, na ordem de abatimento da RN-14. A soma é o `valor` pago.
      required: [multa, jurosMora, juros, amortizacao]
      properties:
        multa:
          type: number
          example: 18.74
        jurosMora:
          type: number
          example: 3.12
        juros:
          type: number
          example: 185
        amortizacao:
          type: number
          description: Parte que abateu o saldo devedor.
          example: 293.14

    PagamentoRegistrado:
      type: object
      required: [id, dataPagamento, valor, distribuicao, parcela, operacao, registradoEm]
      properties:
        id:
          type: integer
          format: int64
          description: Id do evento `PAGAMENTO` no histórico.
          example: 2
        dataPagamento:
          type: string
          format: date
          example: "2026-12-10"
        valor:
          type: number
          example: 500
        identificadorPagamento:
          type: string
          description: Só aparece quando foi enviado no pedido.
          example: app-7f3a91
        origem:
          type: string
          description: Só aparece quando foi enviada no pedido.
          example: CLIENTE
        distribuicao:
          $ref: "#/components/schemas/Distribuicao"
        parcela:
          type: object
          description: Como a parcela ficou depois do pagamento, na `dataPagamento`.
          required: [numero, status, valorEmAberto, encargosEmAberto]
          properties:
            numero:
              type: integer
              example: 1
            status:
              type: string
              enum: [PARCIALMENTE_PAGA, PAGA]
              description: Status gravado. Na consulta de parcelas, uma PARCIALMENTE_PAGA ainda vencida aparece como VENCIDA (RN-11).
            valorEmAberto:
              type: number
              description: Juros + amortização que ainda faltam, sem encargos (RN-13).
              example: 458.77
            encargosEmAberto:
              type: number
              description: Multa + mora que ainda faltam na `dataPagamento`. Para quitar a parcela nesse dia, faltam `valorEmAberto + encargosEmAberto`.
              example: 0
        operacao:
          type: object
          required: [numeroOperacao, status, saldoDevedor]
          properties:
            numeroOperacao:
              type: string
              example: OP-2026-0001
            status:
              $ref: "#/components/schemas/StatusOperacao"
            saldoDevedor:
              type: number
              description: Principal em aberto depois do pagamento (RN-15).
              example: 9706.86
        registradoEm:
          type: string
          format: date-time
          description: Momento do registro, em UTC.
          example: "2026-12-10T13:20:05Z"

    ValorLiquidacao:
      type: object
      required: [numeroOperacao, dataReferencia, valorParaQuitar, saldoDevedor, vencidas, aVencer]
      properties:
        numeroOperacao:
          type: string
          example: OP-2026-0001
        dataReferencia:
          type: string
          format: date
          example: "2027-01-15"
        valorParaQuitar:
          type: number
          description: "`vencidas.total + aVencer.valorPresente`. É o `valor` que o `POST` exige nessa data."
          example: 8558
        saldoDevedor:
          type: number
          description: Principal em aberto (RN-15), para comparação.
          example: 8482.27
        vencidas:
          type: object
          required: [parcelas, total]
          properties:
            parcelas:
              type: array
              description: Vencidas em aberto, com os encargos na data. Lista vazia sai como `[]`.
              items:
                type: object
                required: [numero, vencimento, diasEmAtraso, valorEmAberto, multa, jurosMora, total]
                properties:
                  numero:
                    type: integer
                  vencimento:
                    type: string
                    format: date
                  diasEmAtraso:
                    type: integer
                  valorEmAberto:
                    type: number
                  multa:
                    type: number
                    description: Multa em aberto.
                  jurosMora:
                    type: number
                    description: Juros de mora em aberto.
                  total:
                    type: number
                    description: "`valorEmAberto + multa + jurosMora`."
            total:
              type: number
        aVencer:
          type: object
          required: [parcelas, valorNominal, valorPresente, desconto, amortizacao, juros]
          properties:
            parcelas:
              type: array
              items:
                type: object
                required: [numero, vencimento, valorEmAberto, valorPresente, desconto]
                properties:
                  numero:
                    type: integer
                  vencimento:
                    type: string
                    format: date
                  valorEmAberto:
                    type: number
                  valorPresente:
                    type: number
                    description: RN-16, arredondado ao centavo. Igual ao `valorEmAberto` na parcela que vence no próprio dia.
                  desconto:
                    type: number
                    description: "`valorEmAberto - valorPresente`."
            valorNominal:
              type: number
              description: Soma dos `valorEmAberto`.
            valorPresente:
              type: number
              description: Soma dos `valorPresente`.
            desconto:
              type: number
              description: "`valorNominal - valorPresente`."
            amortizacao:
              type: number
              description: Parte do valor presente que é principal (o saldo devedor dessas parcelas).
            juros:
              type: number
              description: Juros pro rata do período em curso (`valorPresente - amortizacao`). Zero no dia de um vencimento.

    LiquidacaoRequest:
      type: object
      required: [valor]
      properties:
        valor:
          type: number
          description: Igual ao `valorParaQuitar` na `dataPagamento`.
          example: 8558
        dataPagamento:
          type: string
          format: date
          description: RN-09. Omitida, vale hoje. Não pode ser futura, anterior à `dataLiberacao` nem anterior à última movimentação financeira da operação.
          example: "2027-01-15"
        identificadorPagamento:
          type: string
          maxLength: 50
          description: Opcional. Repetido na mesma operação = reenvio (`200`, nada é gravado).
          example: app-9c41d0
        origem:
          type: string
          maxLength: 30
          description: Opcional, texto livre. Só vai para o histórico.
          example: CLIENTE

    LiquidacaoRegistrada:
      type: object
      required: [id, dataPagamento, valor, vencidas, aVencer, operacao, registradoEm]
      properties:
        id:
          type: integer
          format: int64
          description: Id do evento `LIQUIDACAO` no histórico.
          example: 4
        dataPagamento:
          type: string
          format: date
          example: "2027-01-15"
        valor:
          type: number
          example: 8558
        identificadorPagamento:
          type: string
          description: Só aparece quando foi enviado no pedido.
        origem:
          type: string
          description: Só aparece quando foi enviada no pedido.
        vencidas:
          type: array
          description: Um lançamento por parcela vencida, com a distribuição da RN-14. Lista vazia sai como `[]`.
          items:
            type: object
            required: [numero, distribuicao]
            properties:
              numero:
                type: integer
              distribuicao:
                $ref: "#/components/schemas/Distribuicao"
        aVencer:
          type: object
          description: O lançamento único da operação para as parcelas a vencer (RN-18).
          required: [parcelas, valorNominal, desconto, amortizacao, juros, valor]
          properties:
            parcelas:
              type: array
              description: Números das parcelas quitadas por valor presente.
              items:
                type: integer
            valorNominal:
              type: number
            desconto:
              type: number
            amortizacao:
              type: number
              description: O saldo devedor que restava.
            juros:
              type: number
            valor:
              type: number
              description: "`amortizacao + juros`, o valor presente pago."
        operacao:
          type: object
          required: [numeroOperacao, status, saldoDevedor]
          properties:
            numeroOperacao:
              type: string
              example: OP-2026-0001
            status:
              $ref: "#/components/schemas/StatusOperacao"
            saldoDevedor:
              type: number
              example: 0
        registradoEm:
          type: string
          format: date-time
          example: "2027-01-15T12:45:30Z"

    ResumoFinanceiro:
      type: object
      description: Totais da operação na data de referência (RN-20). Todos os campos sempre presentes, inclusive zerados.
      required: [numeroOperacao, dataReferencia, status, diasEmAtraso, totalContratado, totalPrevisto, totalPago, valorAmortizado, jurosPagos, encargosPagos, descontoAntecipacao, valorVencido, encargosEmAberto, saldoDevedor, valorParaQuitar]
      properties:
        numeroOperacao:
          type: string
          example: OP-2026-0001
        dataReferencia:
          type: string
          format: date
          example: "2026-12-10"
        status:
          $ref: "#/components/schemas/StatusOperacao"
        diasEmAtraso:
          type: integer
          minimum: 0
          description: Maior atraso, em dias corridos, entre as parcelas em aberto na data (RN-10). `0` sem atraso e em operação `LIQUIDADA`.
          example: 10
        totalContratado:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Valor da operação (`valorAprovado`)."
          example: 10000
        totalPrevisto:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Soma das parcelas do calendário original. A amortização antecipada não muda esse total."
          example: 11242.88
        totalPago:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Tudo o que o cliente pagou (parcelas, encargos, amortizações e liquidação), sem o desconto."
          example: 500
        valorAmortizado:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Parte do `totalPago` que abateu principal."
          example: 293.14
        jurosPagos:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Parte do `totalPago` que foi para juros remuneratórios."
          example: 185
        encargosPagos:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Multa e juros de mora pagos."
          example: 21.86
        descontoAntecipacao:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Desconto concedido em amortizações e na liquidação (soma nominal − valor presente)."
          example: 0
        valorVencido:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Valor em aberto das parcelas vencidas, sem encargos."
          example: 458.77
        encargosEmAberto:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Multa e mora das parcelas vencidas, na data de referência."
          example: 0
        saldoDevedor:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Principal em aberto (RN-15)."
          example: 9706.86
        valorParaQuitar:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "Valor da liquidação na data de referência (RN-18). `0` em operação `LIQUIDADA`."
          example: 9763.54
