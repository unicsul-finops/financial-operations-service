openapi: 3.0.3

info:
  title: Operações Financeiras — Esteira de Crédito
  version: 2.0.0
  description: |
    Última etapa da Esteira de Crédito (Score :8080 → Decisão :8081 → Juros → **Operações :8083**).

    Recebe do serviço de juros a operação **já definida** com o cliente, com o calendário de parcelas pronto, registra a operação e permite consultar a situação e o cronograma.

    - O calendário **não** é recalculado aqui: ele é gravado como veio, depois de conferido (as contas precisam fechar).
    - O `identificador` do juros é **obrigatório**, vira o `numeroOperacao` e identifica a operação em toda a esteira. Reenviar o mesmo identificador não grava de novo (`200`).
    - O `POST` só confirma o registro (`id`, `numeroOperacao`, `status`, `criadoEm`). Os dados completos ficam em `GET /operacoes/{identificador}` e `GET /operacoes/{identificador}/parcelas`.
    - As consultas são feitas pelo identificador do juros (`/operacoes/OP-2026-0001`). O `id` interno também é aceito.
    - O juros manda as taxas em **percentual** (`1.85` = 1,85%). Nas respostas, **todas as taxas saem em fração** (`0.0185`).
    - Data/hora sem fuso no payload é interpretada como **GMT-03:00**. Nas respostas, data/hora sai em UTC.
    - Valores monetários são calculados com decimal exato. No JSON saem como número, e zeros à direita não são preservados (`185.00` sai como `185`).
    - A situação de atraso (`EM_ATRASO`, `INADIMPLENTE`) e o `diasEmAtraso` são **calculados na consulta**, para a `dataReferencia` (padrão: hoje, GMT-03:00), e nunca gravados. Operação `LIQUIDADA` continua `LIQUIDADA` em qualquer data.
    - Todos os erros têm o formato `{"erro": "mensagem"}`, inclusive rota inexistente (`404`) e método não permitido (`405`).

servers:
  # relativo de propósito: quem abre o swagger de outra máquina (http://IP:8083/swagger) testa contra esse mesmo IP, não contra o próprio localhost.
  - url: /
    description: Mesmo endereço em que este Swagger foi aberto

tags:
  - name: Operações
    description: Registro, consulta, situação (atraso e inadimplência) e amortização antecipada das operações definidas no serviço de juros.
  - name: Saúde
    description: Verificação de disponibilidade.

paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica se o serviço está no ar
      operationId: health
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

