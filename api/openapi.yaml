          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacaoCriada"
        "200":
          description: O `identificador` já estava registrado (reenvio). Nada foi gravado; a resposta confirma a operação existente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacaoCriada"
        "400":
          description: JSON malformado ou regra de validação violada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                corpoInvalido:
                  summary: JSON malformado ou com tipo errado
                  value:
                    erro: corpo da requisição inválido
                identificadorAusente:
                  summary: operacao.identificador não enviado
                  value:
                    erro: operacao.identificador não pode ser vazio
                naoDefinida:
                  summary: Estado diferente de DEFINIDA
                  value:
                    erro: apenas operações com operacao.estado DEFINIDA podem ser registradas
                documento:
                  summary: Documento não bate com o tipo de pessoa
                  value:
                    erro: cliente.documento deve ter 11 dígitos para PF e 14 para PJ
                taxaAusente:
                  summary: taxa.taxaFinalMes não enviada
                  value:
