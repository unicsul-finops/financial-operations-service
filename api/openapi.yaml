  /operacoes/{identificador}/amortizacoes/simulacao:
    get:
      tags: [Operações]
      summary: Simula a antecipação das últimas parcelas
      description: |
        Calcula, sem gravar nada, quanto custa antecipar as **últimas** `quantidadeParcelas` parcelas em aberto na `dataReferencia` (RN-16 e RN-17).

        Cada parcela entra pelo valor presente, `valorParcela / (1 + i) ^ (k − f)`, em que `i` é a taxa mensal do contrato, `k` é a posição da parcela entre as que ainda vão vencer e `f` é a fração já decorrida do período atual. No meio de um período, o valor presente se divide em `amortizacao` (parte de principal) e `juros` (juros pro rata do período em curso); no dia de um vencimento, `juros` é `0`. A parcela que vence na própria `dataReferencia` entra pelo valor em aberto, sem desconto. O `desconto` é `valorParcela − valorPresente`. A diferença de centavos do arredondamento fica na última parcela da lista.

        Responde `400` se houver parcela vencida em aberto ou `PARCIALMENTE_PAGA`, se a `quantidadeParcelas` for inválida ou se ela cobrir todas as parcelas em aberto, porque isso é liquidação total.
      operationId: simularAmortizacao
      parameters:
        - $ref: "#/components/parameters/IdentificadorOperacao"
        - name: quantidadeParcelas
          in: query
          required: true
          description: Quantas das últimas parcelas em aberto antecipar. Maior que zero e menor que o total de parcelas em aberto.
          schema:
            type: integer
            minimum: 1
          example: 2
        - $ref: "#/components/parameters/DataReferencia"
      responses:
        "200":
          description: Simulação calculada. Nada foi gravado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulacaoAmortizacao"
              examples:
                noVencimento:
                  $ref: "#/components/examples/SimulacaoNoVencimento"
                meioDoPeriodo:
                  $ref: "#/components/examples/SimulacaoMeioDoPeriodo"
        "400":
          description: Parâmetro inválido, parcela vencida em aberto ou `PARCIALMENTE_PAGA`, ou pedido que cobre todas as parcelas em aberto (liquidação).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                identificadorInvalido:
                  summary: Identificador que não é id nem numeroOperacao
                  value:
                    erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
                quantidadeAusente:
                  summary: quantidadeParcelas não enviada
                  value:
                    erro: quantidadeParcelas é obrigatório
                quantidadeInvalida:
                  summary: quantidadeParcelas zero, negativa ou não inteira
                  value:
                    erro: quantidadeParcelas deve ser um inteiro maior que zero
                dataReferenciaInvalida:
                  summary: dataReferencia fora do formato
                  value:
                    erro: dataReferencia deve estar no formato YYYY-MM-DD
                dataReferenciaAnteriorAoUltimoPagamento:
                  summary: dataReferencia antes do último pagamento (RN-09)
                  value:
                    erro: dataReferencia não pode ser anterior à data do último pagamento (2026-12-30)
                operacaoLiquidada:
                  summary: Operação já liquidada
                  value:
                    erro: a operação já está liquidada, não há parcelas para antecipar
                parcelaVencida:
                  summary: Parcela vencida em aberto (RN-17)
                  value:
                    erro: a parcela 1 está vencida e em aberto, pague o atraso antes de antecipar parcelas
                parcelaParcialmentePaga:
                  summary: Parcela PARCIALMENTE_PAGA (RN-17)
                  value:
                    erro: a parcela 5 está parcialmente paga, quite a parcela antes de antecipar parcelas
                quantidadeMaiorQueEmAberto:
                  summary: Mais parcelas do que as em aberto
                  value:
                    erro: quantidadeParcelas não pode ser maior que as 10 parcelas em aberto
                todasAsParcelas:
                  summary: Todas as parcelas em aberto, isso é liquidação (RN-17)
                  value:
                    erro: quantidadeParcelas cobre todas as 10 parcelas em aberto, para quitar tudo use a liquidação da operação
        "404":
          $ref: "#/components/responses/NaoEncontrada"

  /operacoes/{identificador}/amortizacoes:
    post:
      tags: [Operações]
      summary: Registra a antecipação das últimas parcelas
      description: |
        Quita as **últimas** `quantidadeParcelas` parcelas em aberto pelo valor presente (RN-16 e RN-17), com as mesmas regras e a mesma conta da simulação.

        Grava o evento `AMORTIZACAO_ANTECIPADA` com **um lançamento por parcela quitada**, com `amortizacao`, `juros` (pro rata) e `desconto`, e recalcula a tabela das parcelas que restam, de modo que o saldo termine em `0` na última. A tabela atualizada sai em `GET /operacoes/{identificador}/parcelas`.

        Sem `dataPagamento`, vale hoje (RN-09). O `identificadorPagamento` é opcional e serve de chave de idempotência: reenviar o mesmo identificador na mesma operação devolve `200` com o registro já gravado, sem gravar de novo. Se ele não for enviado, o campo não aparece na resposta.

        Responde `400` se houver parcela vencida em aberto ou `PARCIALMENTE_PAGA`, se a `quantidadeParcelas` for inválida ou se ela cobrir todas as parcelas em aberto, porque isso é liquidação total.
      operationId: registrarAmortizacao
      parameters:
        - $ref: "#/components/parameters/IdentificadorOperacao"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmortizacaoRequest"
            examples:
              rn17:
                summary: Antecipar as 2 últimas parcelas em 30/12/2026 (RN-17)
                value:
                  quantidadeParcelas: 2
                  dataPagamento: "2026-12-30"
                  identificadorPagamento: PAG-2026-0003
              semIdentificador:
                summary: Sem identificadorPagamento e sem dataPagamento (vale hoje)
                value:
                  quantidadeParcelas: 2
      responses:
        "201":
          description: Amortização registrada.
          headers:
            Location:
              description: Caminho da operação, pelo `numeroOperacao`.
              schema:
                type: string
              example: /operacoes/OP-2026-0001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmortizacaoRegistrada"
              examples:
                noVencimento:
                  $ref: "#/components/examples/AmortizacaoRegistradaNoVencimento"
                meioDoPeriodo:
                  $ref: "#/components/examples/AmortizacaoRegistradaMeioDoPeriodo"
        "200":
          description: Reenvio do mesmo `identificadorPagamento`. Devolve o registro já gravado, sem gravar de novo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmortizacaoRegistrada"
              examples:
                reenvio:
                  $ref: "#/components/examples/AmortizacaoRegistradaNoVencimento"
        "400":
          description: JSON inválido, data fora das regras, parcela vencida em aberto ou `PARCIALMENTE_PAGA`, ou pedido que cobre todas as parcelas em aberto (liquidação).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                identificadorInvalido:
                  summary: Identificador que não é id nem numeroOperacao
                  value:
                    erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
                corpoInvalido:
                  summary: JSON malformado ou com tipo errado
                  value:
                    erro: corpo da requisição inválido
                quantidadeAusente:
                  summary: quantidadeParcelas não enviada
                  value:
                    erro: quantidadeParcelas é obrigatório
                quantidadeInvalida:
                  summary: quantidadeParcelas zero, negativa ou não inteira
                  value:
                    erro: quantidadeParcelas deve ser um inteiro maior que zero
                dataPagamentoInvalida:
                  summary: dataPagamento fora do formato
                  value:
                    erro: dataPagamento deve estar no formato YYYY-MM-DD
                dataPagamentoFutura:
                  summary: dataPagamento no futuro (RN-09)
                  value:
                    erro: dataPagamento não pode ser futura
                dataPagamentoAnteriorALiberacao:
                  summary: dataPagamento antes da dataLiberacao (RN-09)
                  value:
                    erro: dataPagamento não pode ser anterior à dataLiberacao (2026-10-30)
                dataPagamentoAnteriorAoUltimoPagamento:
                  summary: dataPagamento antes do último pagamento (RN-09)
                  value:
