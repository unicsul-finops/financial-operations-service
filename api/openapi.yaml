                  value:
                    erro: a parcela 1 está vencida e em aberto, pague o atraso antes de antecipar parcelas
                parcelaParcialmentePaga:
                  summary: Parcela PARCIALMENTE_PAGA (RN-17)
                  value:
                    erro: a parcela 5 está parcialmente paga, quite a parcela antes de antecipar parcelas
                quantidadeMaiorQueEmAberto:
                  summary: Mais parcelas do que as em aberto
                  value:
                    erro: quantidadeParcelas não pode ser maior que as 10 parcelas em aberto
                todasAsParcelas:
                  summary: Todas as parcelas em aberto, isso é liquidação (RN-17)
                  value:
                    erro: quantidadeParcelas cobre todas as 10 parcelas em aberto, para quitar tudo use a liquidação da operação
        "404":
          $ref: "#/components/responses/NaoEncontrada"

  /operacoes/{identificador}/parcelas/{numero}/pagamentos:
    post:
      tags: [Operações]
      summary: Registra o pagamento de uma parcela
      description: |
        RN-14, RN-15 e RN-19. O pagamento é por parcela e só vale para as vencidas e a próxima a vencer.
        Dentro da parcela o valor abate, nesta ordem: multa → juros de mora → juros → amortização (RN-13).
        O saldo devedor cai só pela parte que foi para a amortização.
        O valor não pode passar do total para quitar a parcela na `dataPagamento` (valor em aberto + encargos em aberto). Pagamento de parcela não dá desconto.

        Quitar a última parcela em aberto liquida a operação (RN-19): `operacao.status` sai `LIQUIDADA` e um evento `LIQUIDACAO` sem valor é gravado junto.

        Evento `PAGAMENTO`, lançamento, status da parcela e saldo são gravados numa transação só (ADR-012).

        **Reenvio:** com um `identificadorPagamento` que já existe na operação, nada é gravado e a resposta é `200` com o pagamento já registrado. Essa conferência vem antes das validações, para o reenvio de um pagamento que quitou a parcela não virar `400`.
      operationId: pagarParcela
      parameters:
        - $ref: "#/components/parameters/IdentificadorOperacao"
        - $ref: "#/components/parameters/NumeroParcela"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoRequest"
            examples:
              parcial:
                summary: RN-14, pagamento parcial da parcela 1 com 10 dias de atraso
                value:
                  valor: 500
                  dataPagamento: "2026-12-10"
                  identificadorPagamento: app-7f3a91
                  origem: CLIENTE
              quitacao:
                summary: RN-14, quitação da parcela 1 dez dias depois
                value:
                  valor: 460.3
                  dataPagamento: "2026-12-20"
                  identificadorPagamento: app-7f3a92
                  origem: CLIENTE
      responses:
        "201":
          description: Pagamento registrado.
          headers:
            Location:
              description: Histórico da operação, onde o pagamento aparece como evento.
              schema:
                type: string
                example: /operacoes/OP-2026-0001/historico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagamentoRegistrado"
              examples:
                parcial:
                  $ref: "#/components/examples/PagamentoParcial"
                quitacao:
                  $ref: "#/components/examples/PagamentoQuitacao"
        "200":
          description: O `identificadorPagamento` já existia na operação (reenvio). Nada foi gravado; a resposta é o pagamento já registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagamentoRegistrado"
              examples:
                reenvio:
                  $ref: "#/components/examples/PagamentoParcial"
        "400":
          description: JSON malformado, identificador ou número de parcela inválido, ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                corpoInvalido:
                  value:
                    erro: corpo da requisição inválido
                identificadorInvalido:
                  value:
                    erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
                numeroParcelaInvalido:
                  value:
                    erro: numero da parcela inválido, use um inteiro a partir de 1
                valorAusente:
                  value:
                    erro: valor é obrigatório
                valorNaoPositivo:
                  value:
                    erro: valor deve ser maior que zero
                valorCasasDecimais:
                  value:
                    erro: valor deve ter no máximo 2 casas decimais
                dataPagamentoInvalida:
                  value:
                    erro: dataPagamento deve estar no formato YYYY-MM-DD
                dataPagamentoFutura:
                  value:
                    erro: dataPagamento não pode ser futura
                dataPagamentoAntesDaLiberacao:
                  value:
                    erro: dataPagamento não pode ser anterior à dataLiberacao da operação
                dataPagamentoAnterior:
                  summary: RN-09, só para frente
                  value:
                    erro: dataPagamento não pode ser anterior à data da última movimentação financeira da operação
                identificadorPagamentoVazio:
                  value:
                    erro: identificadorPagamento não pode ser vazio
                identificadorPagamentoTamanho:
                  value:
                    erro: identificadorPagamento deve ter no máximo 50 caracteres
                origemTamanho:
                  value:
                    erro: origem deve ter no máximo 30 caracteres
                operacaoLiquidada:
                  value:
                    erro: a operação está liquidada e não aceita mais pagamentos
                parcelaPaga:
                  value:
                    erro: parcela 1 já está paga
                parcelaNaoLiberada:
                  value:
                    erro: a parcela 3 ainda não pode ser paga, só as vencidas e a próxima a vencer
                valorAcimaDoDevido:
                  value:
                    erro: valor maior que o total para quitar a parcela 1 em 2026-12-10, que é 958.77
                identificadorJaUsado:
                  summary: O identificador é de outra movimentação (outro tipo ou outra parcela)
                  value:
                    erro: identificadorPagamento já foi usado em outra movimentação da operação
        "404":
          description: Operação ou parcela não encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                operacao:
                  value:
                    erro: operação não encontrada
                parcela:
                  value:
                    erro: parcela não encontrada

  /operacoes/{identificador}/liquidacao:
    get:
      tags: [Operações]
      summary: Consulta o valor para quitar a operação
      description: |
        RN-18 e RN-16. Valor para quitar na data de referência = parcelas vencidas em aberto com encargos (sem desconto) + parcelas a vencer pelo valor presente. Sem tarifa.
        A parcela que vence no próprio dia entra em `aVencer` pelo valor em aberto, sem desconto nem encargos.
        O valor presente de cada parcela é arredondado ao centavo e o total é a soma delas, como no exemplo da RN-17.
        Operação `LIQUIDADA` não tem valor para quitar (`400`).
      operationId: consultarLiquidacao
      parameters:
        - $ref: "#/components/parameters/IdentificadorOperacao"
        - $ref: "#/components/parameters/DataReferencia"
      responses:
        "200":
          description: Valor para quitar na data de referência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValorLiquidacao"
              examples:
                diaDoVencimento:
                  $ref: "#/components/examples/LiquidacaoNoVencimento"
                meioDoPeriodo:
                  $ref: "#/components/examples/LiquidacaoNoMeioDoPeriodo"
        "400":
          description: Identificador ou data inválidos (RN-09), ou operação já liquidada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                identificadorInvalido:
                  value:
                    erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
                dataReferenciaInvalida:
                  value:
                    erro: dataReferencia deve estar no formato YYYY-MM-DD
                dataReferenciaAnterior:
                  value:
                    erro: dataReferencia não pode ser anterior à data da última movimentação financeira da operação
                operacaoLiquidada:
                  value:
                    erro: a operação já está liquidada
        "404":
          $ref: "#/components/responses/NaoEncontrada"

    post:
      tags: [Operações]
      summary: Quita a operação antes do prazo
      description: |
        RN-18 e RN-19. O `valor` precisa ser igual ao valor para quitar na `dataPagamento` (o mesmo do `GET`), para não quitar com um número velho.
        Depois: todas as parcelas `PAGA`, saldo devedor `0`, operação `LIQUIDADA`, evento `LIQUIDACAO`.
        As vencidas viram lançamentos por parcela (com encargos); as a vencer, um lançamento só da operação, sem parcela, com o desconto.
        Tudo numa transação só (ADR-012).

        **Reenvio:** com um `identificadorPagamento` que já existe na operação, nada é gravado e a resposta é `200` com a liquidação já registrada. Essa conferência vem antes das validações, para o reenvio não virar `400` por a operação já estar liquidada.
      operationId: liquidarOperacao
      parameters:
        - $ref: "#/components/parameters/IdentificadorOperacao"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiquidacaoRequest"
            example:
              valor: 8558
              dataPagamento: "2027-01-15"
              identificadorPagamento: app-9c41d0
      responses:
        "201":
          description: Operação liquidada.
          headers:
            Location:
              description: Histórico da operação, onde a liquidação aparece como evento.
              schema:
                type: string
                example: /operacoes/OP-2026-0001/historico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidacaoRegistrada"
              examples:
                meioDoPeriodo:
                  $ref: "#/components/examples/LiquidacaoRegistrada"
        "200":
          description: O `identificadorPagamento` já existia na operação (reenvio). Nada foi gravado; a resposta é a liquidação já registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidacaoRegistrada"
              examples:
                reenvio:
                  $ref: "#/components/examples/LiquidacaoRegistrada"
        "400":
          description: JSON malformado, identificador inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                corpoInvalido:
                  value:
                    erro: corpo da requisição inválido
                identificadorInvalido:
                  value:
                    erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
                valorAusente:
                  value:
                    erro: valor é obrigatório
                valorDiferente:
                  value:
                    erro: valor deve ser igual ao valor para quitar em 2027-01-15, que é 8558.00
                dataPagamentoInvalida:
                  value:
                    erro: dataPagamento deve estar no formato YYYY-MM-DD
                dataPagamentoFutura:
                  value:
                    erro: dataPagamento não pode ser futura
                dataPagamentoAntesDaLiberacao:
                  value:
                    erro: dataPagamento não pode ser anterior à dataLiberacao da operação
                dataPagamentoAnterior:
                  value:
                    erro: dataPagamento não pode ser anterior à data da última movimentação financeira da operação
                identificadorPagamentoVazio:
                  value:
                    erro: identificadorPagamento não pode ser vazio
                identificadorPagamentoTamanho:
                  value:
                    erro: identificadorPagamento deve ter no máximo 50 caracteres
                origemTamanho:
                  value:
                    erro: origem deve ter no máximo 30 caracteres
                operacaoLiquidada:
                  value:
                    erro: a operação já está liquidada
                identificadorJaUsado:
                  summary: O identificador é de outra movimentação
                  value:
                    erro: identificadorPagamento já foi usado em outra movimentação da operação
        "404":
          $ref: "#/components/responses/NaoEncontrada"

  /operacoes/{identificador}/resumo:
    get:
      tags: [Operações]
      summary: Consulta o resumo financeiro da operação
      description: |
        RN-20. Totais da operação na data de referência, somados a partir dos lançamentos e das parcelas. Nada é gravado.

        Conferência que vale sempre: `totalPago = valorAmortizado + jurosPagos + encargosPagos`. O `descontoAntecipacao` não entra no `totalPago`, porque não é dinheiro recebido.

        `valorParaQuitar` é o mesmo valor do `GET /operacoes/{identificador}/liquidacao` na mesma data, e é `0` em operação `LIQUIDADA`.

        `status` e `diasEmAtraso` seguem as regras da consulta da operação (RN-11 e RN-12).
      operationId: consultarResumo
      parameters:
        - $ref: "#/components/parameters/IdentificadorOperacao"
        - $ref: "#/components/parameters/DataReferencia"
      responses:
        "200":
          description: Resumo financeiro na data de referência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumoFinanceiro"
              examples:
                aposPagamentoParcial:
                  $ref: "#/components/examples/ResumoAposPagamentoParcial"
        "400":
          description: Identificador ou data inválidos (RN-09).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              examples:
                identificadorInvalido:
                  value:
                    erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
                dataReferenciaInvalida:
                  value:
                    erro: dataReferencia deve estar no formato YYYY-MM-DD
                dataReferenciaAnterior:
                  value:
                    erro: dataReferencia não pode ser anterior à data da última movimentação financeira da operação
        "404":
          $ref: "#/components/responses/NaoEncontrada"

components:
  parameters:
    IdentificadorOperacao:
      name: identificador
      in: path
      required: true
      description: |
        O `numeroOperacao` (`OP-AAAA-NNNN`), que é o identificador do juros e o jeito normal de consultar. Aceito em maiúsculas ou minúsculas. O `id` interno (inteiro) também é aceito.
      schema:
        type: string
        pattern: '^([1-9][0-9]*|[Oo][Pp]-[0-9]{4}-[0-9]{4,})$'
      examples:
        numero:
          summary: Pelo identificador do juros (recomendado)
          value: OP-2026-0001
        id:
          summary: Pelo id interno
          value: "1"

    DataReferencia:
      name: dataReferencia
      in: query
      required: false
      description: |
        Dia (`YYYY-MM-DD`, em GMT-03:00) para o qual o resultado é calculado (RN-09). Sem o parâmetro, vale hoje. Nada é gravado: é só a data usada na conta.
      schema:
        type: string
        format: date
      example: "2026-12-01"

    NumeroParcela:
      name: numero
      in: path
      required: true
      description: O `numero` da parcela no calendário (1, 2, 3…).
