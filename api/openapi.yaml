    get:
      tags: [Operações]
      summary: Lista as operações
      description: |
        Da mais recente para a mais antiga, sem as parcelas. Sem operações cadastradas, devolve `[]`.

        O `status` e o `diasEmAtraso` de cada operação são calculados para a `dataReferencia`, com as mesmas regras do `GET /operacoes/{identificador}` (RN-11 e RN-12).
      operationId: listarOperacoes
      parameters:
        - $ref: "#/components/parameters/DataReferencia"
      responses:
        "200":
          description: Lista de operações, com a situação calculada para a `dataReferencia`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operacao"
              examples:
                emAtraso:
                  summary: Uma operação com a parcela 1 vencida há 1 dia (dataReferencia 2026-12-01)
                  value:
