components:
  parameters:
    DataReferencia:
      name: dataReferencia
      in: query
      required: false
      description: |
        RN-09: dia em GMT-03:00, no formato YYYY-MM-DD. Omitido, vale hoje nesse fuso.
        Vazio ou data inexistente é inválido. Datas futuras são aceitas para simulação.
        Não pode ser anterior à data do último pagamento, amortização ou liquidação registrado;
        a mesma data é aceita. Não se trata de uma reconstrução histórica.
      schema:
        type: string
        format: date
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      example: "2026-12-10"
    IdentificadorOperacao:
      name: identificador
      in: path
      required: true
      description: |
        O `numeroOperacao` (`OP-AAAA-NNNN`), que é o identificador do juros e o jeito normal de consultar. Aceito em maiúsculas ou minúsculas. O `id` interno (inteiro) também é aceito.
      schema:
        type: string
        pattern: '^([1-9][0-9]*|[Oo][Pp]-[0-9]{4}-[0-9]{4,})$'
      examples:
        numero:
          summary: Pelo identificador do juros (recomendado)
          value: OP-2026-0001
        id:
          summary: Pelo id interno
          value: "1"

  examples:
    OperacaoPrice:
      summary: Operação PRICE
      value:
        id: 1
        numeroOperacao: OP-2026-0001
        clienteId: "52998224725"
        tipoPessoa: PF
        status: ATIVA
        definidoEm: "2026-10-08T18:12:40Z"
        dataLiberacao: "2026-10-30"
        saldoDevedor: 10000
        produto:
          codigo: CONSIGNADO_INSS
          nome: Crédito pessoal consignado INSS
          modalidadeBcb: Crédito pessoal consignado INSS - Prefixado
        condicoesFinanceiras:
          valorAprovado: 10000
          prazoMeses: 12
          quantidadeParcelas: 12
          taxaJuros: 0.0185
          taxaJurosAnual: 0.246
          faixaRisco: B
          tetoAplicado: true
          sistemaAmortizacao: PRICE
          primeiroVencimento: "2026-11-30"
        encargos:
          iof:
            diario: 167.65
            adicional: 38
            total: 205.65
          tarifaCadastro: 50
          total: 255.65
        valorLiberado: 9744.35
        cet:
          mensal: 0.0227
          anual: 0.3089
        criadoEm: "2026-10-08T18:13:02Z"

    OperacaoPriceEmAtraso:
      summary: Operação PRICE sem pagamentos em 2026-12-10
      value:
        id: 1
        numeroOperacao: OP-2026-0001
        clienteId: "52998224725"
        tipoPessoa: PF
        status: EM_ATRASO
        definidoEm: "2026-10-08T18:12:40Z"
        dataLiberacao: "2026-10-30"
        saldoDevedor: 10000
        produto:
          codigo: CONSIGNADO_INSS
          nome: Crédito pessoal consignado INSS
          modalidadeBcb: Crédito pessoal consignado INSS - Prefixado
        condicoesFinanceiras:
          valorAprovado: 10000
          prazoMeses: 12
          quantidadeParcelas: 12
          taxaJuros: 0.0185
          taxaJurosAnual: 0.246
          faixaRisco: B
          tetoAplicado: true
          sistemaAmortizacao: PRICE
          primeiroVencimento: "2026-11-30"
        encargos:
          iof:
            diario: 167.65
            adicional: 38
            total: 205.65
          tarifaCadastro: 50
          total: 255.65
        valorLiberado: 9744.35
        cet:
          mensal: 0.0227
          anual: 0.3089
        criadoEm: "2026-10-08T18:13:02Z"

  responses:
    ConsultaInvalida:
      description: Identificador inválido, data inválida ou anterior à última movimentação financeira (RN-09).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            identificadorInvalido:
              value:
                erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
            dataReferenciaInvalida:
              value:
                erro: dataReferencia deve estar no formato YYYY-MM-DD
            dataReferenciaAnterior:
              value:
                erro: dataReferencia não pode ser anterior à data da última movimentação financeira da operação
    IdentificadorInvalido:
      description: O identificador não é um id nem um número de operação.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            erro: "identificador da operação inválido, use o id ou o numeroOperacao (ex.: 1 ou OP-2026-0001)"
    NaoEncontrada:
      description: Operação não encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            erro: operação não encontrada
    ErroInterno:
      description: |
        Falha inesperada, como erro de banco. Hoje é devolvida como `400`, com a mensagem original do erro; a separação em `500` está prevista.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string
          description: Mensagem em português, direcionada a quem consome a API.
          example: operação não encontrada

    Dinheiro:
      type: number
      minimum: 0
      description: Valor em reais, com no máximo 2 casas decimais.

    Percentual:
      type: number
      minimum: 0
      description: Percentual como o juros envia (`1.85` = 1,85%), com no máximo 4 casas decimais.

    CriarOperacaoRequest:
      type: object
      description: Payload do serviço de juros. Campos não listados aqui são aceitos e ignorados.
      required: [operacao, cliente, produto, condicoes, taxa, sistema, resumo, encargos, valorLiberado, cet, calendario]
      properties:
        operacao:
          type: object
          required: [identificador, estado, definidoEm]
          properties:
            identificador:
              type: string
              pattern: '^[Oo][Pp]-[0-9]{4}-[0-9]{4,}$'
              description: Identificador da operação em toda a esteira. Vira o `numeroOperacao`. Repetido = reenvio (`200`).
              example: OP-2026-0001
            estado:
              type: string
              enum: [DEFINIDA]
              description: Só operações definidas com o cliente são registradas. Aceito também em minúsculas.
            definidoEm:
              type: string
              description: "`YYYY-MM-DD HH:MM:SS`, interpretado como GMT-03:00, ou ISO-8601 com fuso (`2026-10-08T15:12:40-03:00`)."
              example: "2026-10-08 15:12:40"
        cliente:
          type: object
          required: [tipoPessoa, documento]
          properties:
            tipoPessoa:
              type: string
              enum: [PF, PJ]
              description: Aceito também em minúsculas.
            documento:
              type: string
              pattern: '^[0-9]{11}([0-9]{3})?$'
              description: CPF (11 dígitos, PF) ou CNPJ (14 dígitos, PJ), só números. Vira o `clienteId`.
              example: "52998224725"
        produto:
          type: object
          required: [codigo, nome, modalidadeBcb]
          properties:
            codigo:
              type: string
              maxLength: 50
              example: CONSIGNADO_INSS
            nome:
              type: string
              maxLength: 100
              example: Crédito pessoal consignado INSS
            modalidadeBcb:
              type: string
              maxLength: 150
              example: Crédito pessoal consignado INSS - Prefixado
        condicoes:
          type: object
          required: [valor, prazoMeses, dataLiberacao]
          properties:
            valor:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: Valor do crédito, maior que zero. Vira o `valorAprovado` e o `saldoDevedor` inicial.
              example: 10000
            prazoMeses:
              type: integer
              minimum: 1
              maximum: 420
              description: Deve ser igual à quantidade de parcelas do `calendario`.
              example: 12
            dataLiberacao:
              type: string
              format: date
              description: O primeiro vencimento deve ser posterior a ela.
              example: "2026-10-30"
        taxa:
          type: object
          required: [faixaRisco, taxaFinalMes, taxaFinalAno, tetoAplicado]
          properties:
            faixaRisco:
              type: string
              maxLength: 10
              description: Faixa de preço do juros (não é a faixa de risco do score).
              example: B
            taxaFinalMes:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              maximum: 100
              exclusiveMaximum: true
              example: 1.85
            taxaFinalAno:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              example: 24.6
            tetoAplicado:
              type: boolean
              example: true
        sistema:
          type: string
          enum: [PRICE, SAC]
          description: Sistema que o cliente escolheu. Aceito também em minúsculas.
        resumo:
          type: object
          required: [totalJuros, totalPago]
          description: Não é gravado; só é conferido contra o `calendario`.
          properties:
            totalJuros:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: Soma dos `juros` do calendário.
              example: 1242.88
            totalPago:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: Soma dos `valor` do calendário.
              example: 11242.88
        encargos:
          type: object
          required: [iof, tarifaCadastro, total]
          description: Descontados na liberação, não entram no saldo devedor.
          properties:
            iof:
              type: object
              required: [diario, adicional, total]
              properties:
                diario:
                  $ref: "#/components/schemas/Dinheiro"
                adicional:
                  $ref: "#/components/schemas/Dinheiro"
                total:
                  allOf:
                    - $ref: "#/components/schemas/Dinheiro"
                  description: "`diario + adicional`."
            tarifaCadastro:
              $ref: "#/components/schemas/Dinheiro"
            total:
              allOf:
                - $ref: "#/components/schemas/Dinheiro"
              description: "`iof.total + tarifaCadastro`."
        valorLiberado:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: "`condicoes.valor - encargos.total`, maior que zero."
          example: 9744.35
        cet:
          type: object
          required: [mensalPercentual, anualPercentual]
          properties:
            mensalPercentual:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              example: 2.27
            anualPercentual:
              allOf:
                - $ref: "#/components/schemas/Percentual"
              example: 30.89
        calendario:
          type: array
          minItems: 1
          maxItems: 420
          description: |
            Gravado como veio, sem recálculo. Precisa fechar: `numero` de 1 a n, vencimentos crescentes (o primeiro depois da `dataLiberacao`), `valor = amortizacao + juros`, `saldoDevedor` encadeado a partir de `condicoes.valor` e `0` na última.
          items:
            $ref: "#/components/schemas/ParcelaJuros"

    ParcelaJuros:
      type: object
      required: [numero, amortizacao, juros, valor, saldoDevedor, vencimento]
      properties:
        numero:
          type: integer
          minimum: 1
          example: 1
        amortizacao:
          $ref: "#/components/schemas/Dinheiro"
        juros:
          $ref: "#/components/schemas/Dinheiro"
        valor:
          allOf:
            - $ref: "#/components/schemas/Dinheiro"
          description: Vira o `valorParcela`.
        saldoDevedor:
          $ref: "#/components/schemas/Dinheiro"
        vencimento:
          type: string
          format: date
          example: "2026-11-30"

    OperacaoCriada:
      type: object
      required: [id, numeroOperacao, status, criadoEm]
      properties:
        id:
          type: integer
          format: int64
          description: Identificador técnico, sequencial, gerado por este serviço.
          example: 1
        numeroOperacao:
          type: string
          pattern: '^OP-[0-9]{4}-[0-9]{4,}$'
          example: OP-2026-0001
        status:
          $ref: "#/components/schemas/StatusOperacao"
        criadoEm:
          type: string
          format: date-time
          example: "2026-10-10T17:32:14Z"

    Operacao:
      type: object
      required: [id, numeroOperacao, clienteId, tipoPessoa, status, definidoEm, dataLiberacao, saldoDevedor, produto, condicoesFinanceiras, encargos, valorLiberado, cet, criadoEm]
      properties:
        id:
          type: integer
          format: int64
          description: Identificador técnico, sequencial, gerado por este serviço.
          example: 1
        numeroOperacao:
          type: string
          pattern: '^OP-[0-9]{4}-[0-9]{4,}$'
          description: O `identificador` enviado pelo serviço de juros, o mesmo em toda a esteira.
          example: OP-2026-0001
        clienteId:
          type: string
          description: CPF ou CNPJ, só números.
          example: "52998224725"
        tipoPessoa:
          type: string
          enum: [PF, PJ]
        status:
          $ref: "#/components/schemas/StatusOperacao"
        definidoEm:
          type: string
          format: date-time
          description: Quando a operação foi definida no juros, em UTC.
          example: "2026-10-08T18:12:40Z"
        dataLiberacao:
          type: string
          format: date
          example: "2026-10-30"
        saldoDevedor:
          type: number
          description: Por enquanto é igual ao `valorAprovado`.
          example: 10000
        produto:
          type: object
          required: [codigo, nome, modalidadeBcb]
          properties:
            codigo:
              type: string
              example: CONSIGNADO_INSS
            nome:
              type: string
              example: Crédito pessoal consignado INSS
            modalidadeBcb:
              type: string
              example: Crédito pessoal consignado INSS - Prefixado
        condicoesFinanceiras:
          $ref: "#/components/schemas/CondicoesFinanceiras"
        encargos:
          type: object
          required: [iof, tarifaCadastro, total]
          properties:
            iof:
              type: object
              required: [diario, adicional, total]
              properties:
                diario:
                  type: number
                  example: 167.65
                adicional:
                  type: number
                  example: 38
                total:
                  type: number
                  example: 205.65
            tarifaCadastro:
              type: number
              example: 50
            total:
              type: number
              example: 255.65
        valorLiberado:
          type: number
          example: 9744.35
        cet:
          type: object
          required: [mensal, anual]
          description: Custo efetivo total, em fração.
          properties:
            mensal:
              type: number
              example: 0.0227
            anual:
              type: number
              example: 0.3089
        criadoEm:
          type: string
          format: date-time
          description: Momento do registro neste serviço, em UTC.
          example: "2026-10-08T18:13:02Z"

    CondicoesFinanceiras:
      type: object
      required: [valorAprovado, prazoMeses, quantidadeParcelas, taxaJuros, taxaJurosAnual, faixaRisco, tetoAplicado, sistemaAmortizacao, primeiroVencimento]
      properties:
        valorAprovado:
          type: number
          example: 10000
        prazoMeses:
          type: integer
          example: 12
        quantidadeParcelas:
          type: integer
          example: 12
        taxaJuros:
          type: number
          description: Taxa mensal em fração (`0.0185` = 1,85% ao mês).
          example: 0.0185
        taxaJurosAnual:
          type: number
          description: Taxa anual em fração.
          example: 0.246
        faixaRisco:
          type: string
          description: Faixa de preço do juros.
          example: B
        tetoAplicado:
          type: boolean
          example: true
        sistemaAmortizacao:
          type: string
          enum: [PRICE, SAC]
        primeiroVencimento:
          type: string
          format: date
          example: "2026-11-30"

    Parcela:
      type: object
      required: [numero, vencimento, valorParcela, amortizacao, juros, saldoDevedor, status, valorEmAberto, diasEmAtraso, encargos, totalParaQuitar]
      properties:
        numero:
          type: integer
          minimum: 1
          example: 1
        vencimento:
          type: string
          format: date
          example: "2026-11-30"
        valorParcela:
          type: number
          description: "`amortizacao + juros`, como veio do juros."
          example: 936.91
        amortizacao:
          type: number
          description: Parte do principal paga na parcela.
          example: 751.91
        juros:
          type: number
          description: Juros do período.
          example: 185
        saldoDevedor:
          type: number
          description: Saldo após a parcela. É `0` na última.
          example: 9248.09
        valorEmAberto:
          type: number
          minimum: 0
          description: Juros + amortização menos juros pagos, amortização paga e desconto concedido (RN-13). Sem multa nem mora. PAGA sempre tem zero. Valor em reais, até duas casas decimais.
          example: 936.91
        diasEmAtraso:
          type: integer
          minimum: 0
          description: Dias corridos entre vencimento e dataReferencia quando vencida (RN-10). Zero no vencimento, antes dele ou se PAGA.
          example: 10
        encargos:
          $ref: "#/components/schemas/EncargosParcela"
        totalParaQuitar:
          type: number
          minimum: 0
          description: Valor em aberto + encargos.total na dataReferencia (RN-13), em reais, até duas casas. Zero para PAGA. Não é a liquidação antecipada da operação (RN-18).
          example: 958.77
        status:
          $ref: "#/components/schemas/StatusParcela"

    EncargosParcela:
      type: object
      description: Encargos por atraso em aberto na dataReferencia (RN-13), em reais, até duas casas. Todos os campos sempre presentes, inclusive zerados.
      required: [multa, jurosMora, total]
      properties:
        multa:
          type: number
          minimum: 0
          description: Multa de 2% da base do primeiro dia de atraso, fixada e arredondada ao centavo, menos multa paga. Zero sem atraso ou para PAGA.
          example: 18.74
        jurosMora:
          type: number
          minimum: 0
          description: Mora simples acumulada (1% x base x dias / 30 por trecho), arredondada somente ao final, menos mora paga. Zero sem atraso ou para PAGA.
          example: 3.12
        total:
          type: number
          minimum: 0
          description: Soma de multa e jurosMora em aberto após os pagamentos de cada componente.
          example: 21.86

    StatusOperacao:
      type: string
      enum: [ATIVA, EM_ATRASO, INADIMPLENTE, RENEGOCIADA, LIQUIDADA]
      description: ATIVA com parcela vencida é exibida como EM_ATRASO (RN-11), sem persistir o atraso. LIQUIDADA permanece LIQUIDADA. INADIMPLENTE será tratado na história #8 e RENEGOCIADA em fase futura.

    StatusParcela:
      type: string
      enum: [PENDENTE, PAGA, PARCIALMENTE_PAGA, VENCIDA]
      description: VENCIDA quando não paga por inteiro e dataReferencia posterior ao vencimento (RN-10 e RN-11), prevalecendo sobre PENDENTE e PARCIALMENTE_PAGA na resposta. PAGA permanece PAGA. O estado calculado não é gravado.
